license:
  name: Dasharo 韌體映像（coreboot、edk2 的 Dasharo 分支，加上 Intel ME／FSP／微碼二進位 blob；各元件依上游專案或 Intel 的授權）
  url: https://docs.dasharo.com/variants/novacustom_v540tu/releases/
  note: 3mdeb 公開下載。v1.0.1 release notes 的 SBOM 對 ME、FSP、flash descriptor 附 Intel OBL 軟體授權（dasharo-blobs 倉庫 licenses 目錄的 PDF）、微碼附 Intel 微碼倉庫的 license 檔；coreboot 與 edk2 兩列頁面沒有列授權。本 repo 只在 CI 下載核對，不重新散布。
notes: |
  挑選的技術理由：完整 32 MiB SPI 映像，有 flash descriptor 與 ME 區域，但 ME 區域的配置是新世代的：
  區域開頭是 CSE layout table（layout 1.7，size 欄位 0x58）→ BP1、BP3 兩個 boot partition，各有 BPDT（version 2）；
  `$FPT` 只出現在 data partition（區域 +0x3A2000），區域開頭與 +0x10 都沒有；BPDT 沒有 FTPR（type 2）項目，沒有名稱是 FTPR 的 `$CPD`；
  `$CPD` 都是 header version 2（長度 0x14、+0x10 是 CRC-32 checksum）。區域內有 14 個 `$CPD` 分割區、15 個 `$MN2`，各分割區的版本不同。
  CSE 主程式在 BP1 的 RBEP（BPDT type 1）與 BP3 的 NFTP（type 7）：兩個 manifest 的版本相同（18.0.10.2285）。
  只靠 `$FPT`／名稱是 FTPR 的 `$CPD` 讀不到這份映像的 ME 版本；intel_cse_layout.py 走 BPDT 的 RBEP＋NFTP，讀到 18.0.10.2285（basis 寫明）。
  格式與判定規則見 docs/notes/c2-csme-layout.md。
  下載頁與 release notes：https://docs.dasharo.com/variants/novacustom_v540tu/releases/ （v1.0.1，2026-01-29）。
  同目錄另有 .sha256 檔（與本檔 sha256 相符，2026-11-13 核對）、EC 版本與 .cap 更新檔；這裡只用 btg_prod 的完整 .rom。
  上游若移除舊版，網址會失效、firmware-fetch 會 FAIL；此時換同系列其他版本（v1.0.0 的 ME 版本在 release notes 也是 18.0.10.2285）。
expected:
  # 只寫有公開出處的值。ME：release notes（v1.0.1、v1.0.0）的 "Intel Management Engine version v18.0.10.2285"。
  intel_me: 18.0.10.2285
  # 微碼：映像讀到 000A06A4／platform 0xE6／revision 0x25。出處兩處：
  #  - Dasharo v1.0.1 release notes 的 SBOM "Intel microcode version MTL C0 0x00000025 0x25 19/03/2025"，連結指到 Intel 微碼倉庫的 intel-ucode/06-aa-04
  #    （檔名 06-aa-04＝CPUID 000A06A4）；
  #  - Intel 微碼倉庫 microcode-20250812 的 releasenote.md："MTL | C0 | 06-aa-04/e6 | 00000024 | 00000025"（/e6＝platform mask 0xE6）。
  microcode:
    - {cpuid: "000A06A4", platform_mask: "0xE6", revision: "0x25"}
  # 映像另外讀出 FSP、coreboot 資訊，release notes 沒有可比對的值（FSP 寫的是 "2024/04/30 v4122_12" 這種編號，與映像裡 FSPH 的 ImageRevision 不同格式），
  # 沒有獨立佐證，所以不寫。
  # 規則表建議（2026-11-14 整理，第二批）：ME 18.0.10.2285 低於 INTEL-SA-01315 的 18.0.18（版本線 18.0），不低於 INTEL-SA-01209 的 18.0.10（比到第三段，build 號不比）。
  # 規則只看版本線，沒有核對平台是不是公告表列的產品（公告的列寫 Core Ultra Processors (Series 1)／Core Ultra）；版本值只經網頁摘要工具讀到，沒有獨立核對；只是建議，是否受影響以 Intel 公告為準。
  # 公告頁：INTEL-SA-01315 https://www.intel.com/content/www/us/en/security-center/advisory/intel-sa-01315.html、INTEL-SA-01209 https://www.intel.com/content/www/us/en/security-center/advisory/intel-sa-01209.html
  advisory_rule:
    - {component: "Intel CSE firmware", version: "18.0.10.2285", suggestion: affected, rule_ids: ["INTEL-SA-01315"]}
  # AMI 核心版本：不是 AMI 韌體（沒有 AMI 的 Firmware ID 紀錄）；coreboot 的 CBFS 檔案沒有解開，所以只鎖定「沒讀到」，不代表映像裡沒有。
  ami_core: {status: not-found}
