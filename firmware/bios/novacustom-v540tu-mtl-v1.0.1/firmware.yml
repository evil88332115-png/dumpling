notes: |
  挑選的技術理由：完整 32 MiB SPI 映像，有 flash descriptor 與 ME 區域，但 ME 區域的配置是新世代的：
  區域開頭是 CSE layout table（layout 1.7，size 欄位 0x58）→ BP1、BP3 兩個 boot partition，各有 BPDT（version 2）；
  `$FPT` 只出現在 data partition（區域 +0x3A2000），區域開頭與 +0x10 都沒有；BPDT 沒有 FTPR（type 2）項目，沒有名稱是 FTPR 的 `$CPD`；
  `$CPD` 都是 header version 2（長度 0x14、+0x10 是 CRC-32 checksum）。區域內有 14 個 `$CPD` 分割區、15 個 `$MN2`，各分割區的版本不同。
  CSE 主程式在 BP1 的 RBEP（BPDT type 1）與 BP3 的 NFTP（type 7）：兩個 manifest 的版本相同（18.0.10.2285）。
  只靠 `$FPT`／名稱是 FTPR 的 `$CPD` 讀不到這份映像的 ME 版本；intel_cse_layout.py 走 BPDT 的 RBEP＋NFTP，讀到 18.0.10.2285（basis 寫明）。
  格式與判定規則見 docs/notes/c2-csme-layout.md。
  下載頁與 release notes：https://docs.dasharo.com/variants/novacustom_v540tu/releases/ （v1.0.1，2026-01-29）。
  同目錄另有 .sha256 檔（與本檔 sha256 相符，2026-11-13 核對）、EC 版本與 .cap 更新檔；這裡只用 btg_prod 的完整 .rom。
  上游若移除舊版，網址會失效、firmware-fetch 會 FAIL；此時換同系列其他版本（v1.0.0 的 ME 版本在 release notes 也是 18.0.10.2285）。
