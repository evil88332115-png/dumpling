  # 與 release notes 的 "Microcode Updates ... M80806C1_000000BE" 一致才寫進來。
  # 映像裡另有 000806C2／revision 0x16，release notes 沒列，沒有獨立佐證，不寫。
  microcode:
    - {cpuid: "000806C1", platform_mask: "0x80", revision: "0xBE"}
  # GOP：映像解開後讀到驅動 build 編號 1070（只有 build 編號，工具讀不到完整版本），
  # 與 release notes 的 "Integrated Graphics GOP UEFI Driver: 17.0.1070" 的最後一段一致才寫進來。
  intel_gop: "1070"
  # legacy VBIOS：映像讀到 "1003 PC 14.34"，但 release notes 查無獨立佐證（pdftotext 全文無 VBIOS／1003／14.34），不寫 intel_legacy_vbios。
