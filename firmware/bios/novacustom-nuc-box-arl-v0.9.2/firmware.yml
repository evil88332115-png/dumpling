notes: |
  挑選的技術理由：完整 32 MiB SPI 映像（flash descriptor＋ME 區域 0x4000–0x9FFFFF＋BIOS 區域），ME 區域開頭的 CSE layout table 是 layout 1.7 的 **Size 0x60** 變體
  （表總長 0x70；先前只認 0x40／0x48／0x58）。讀到的欄位（位置相對 ME 區域開頭；檔案位置加 0x4000）：
  - +0x10 Size＝0x60，+0x12 Flags＝0（沒有 CSE redundancy），+0x14 CRC-32 stored＝0xB8EFACAF，照 `intel_cse_layout.py` 現有算法算出的值相同
    （範圍 d[+0x10:+0x14]＋4 個 0＋d[+0x18:+0x70]）。
  - data＝(0x3A1000, 0xA4000)、BP1＝(0x1000, 0x3A0000)、BP2 空、BP3＝(0x445000, 0x3CA000)、BP4／BP5 空、temp pages 空、
    external error log＝(0x423000, 0x1000)；+0x58…+0x6F（比 Size 0x58 多出來的部分加上原有的填充）共 24 bytes 全是 0。
  - BP1 與 BP3 的開頭都是 BPDT（version 2，項目數 9 與 5；FIT 工具版本欄位 18.1.18.2749，不當依據）。
    BP1 的 BPDT type 1（RBEP）在 BP1 +0x1000、`$CPD`，RBEP.man＝18.1.18.2724（檔案位置 0x6404）；
    BP3 的 BPDT type 7（NFTP）在 BP3 +0x1000、`$CPD`，NFTP.man＝18.1.18.2724（檔案位置 0x44A1AC）；沒有 FTPR（type 2）項目。
  - `$FPT` 只在 data partition（區域 +0x3A1000，11 個分割區），區域開頭與 +0x10 都沒有；以前的解析在這份映像上是 ME 版本 unknown（GAP）。
  - 這個 .rom 檔名與目錄仍叫 mtl，但 v0.9.2 的 release notes 寫 FSP 是 "Intel Firmware Support Package for Arrow Lake-U/H version IoT ARL-UH IPU 2026.3 (6114_54)"，
    ME 版本 18.1.18.2724。同目錄的 v0.9.0／v0.9.1 是 Meteor Lake FSP、ME 18.0.5.2028，這裡不用。
  格式與判定規則、Size 0x60 多出欄位的處理見 docs/notes/c2-csme-layout.md。
  下載頁與 release notes：https://docs.dasharo.com/variants/novacustom_nuc_box/releases/ （v0.9.2，2026-07-21）。
  同目錄另有 .rom.sha256（與本檔 sha256 相符，2026-11-13 核對）與 .cap 更新檔；這裡只用完整 .rom。
  上游若移除舊版，網址會失效、firmware-fetch 會 FAIL；此時改用同系列較新的版本並重新核對 Size 與 CRC。
