notes: |
  選它的技術理由：AMD 平台的公開 AMI BIOS 更新檔，用來驗證 AMD Embedded Firmware Structure、PSP／BIOS 目錄、AMD 微碼與 AGESA 字串的解析（tools/cra/amd_psp.py，
  說明 docs/notes/c2-amd-psp.md）。檔案 16.7 MB，CI 下載成本低。
  下載頁（動態頁面，直接下載網址是靜態 CDN 路徑）：https://www.asus.com/motherboards-components/motherboards/prime/prime-b550m-a/helpdesk_bios/
  zip 內有 PRIME-B550M-A-ASUS-3404.CAP（33558528 位元組＝4 KiB 標頭＋兩個 16 MiB 視窗）和 BIOSRenamer.exe（只當資料讀，不執行）。
  結構（amd_psp.py 讀到的）：CAP 標頭讓 EFS 不在固定位置（0x21000、0x1021000，各視窗位移 0x1000）；兩個 EFS 各指向一個 combo 目錄（2PSP／2BHD），
  combo 再指到多個 L1 目錄（$PSP、$BHD）；較新的世代有 L1 的 0x40／0x70 指標項目指到 L2 目錄（$PL2、$BL2）。採用的目錄共 17 個、244 個目錄項目（工具摘要的 19 個目錄、271 個項目是另含 2 個未採用的讀法——0x131000、0x15a000 各有一個基底 0 的讀法——的口徑）、
  19 份 AMD 微碼（BIOS 目錄 type 0x66）、AGESA 字串 `AGESA!V9` + `ComboAM4v2PI 1.2.0.B`。第二個 EFS 的一個指標在視窗座標與檔案偏移兩種讀法下都指到目錄，
  同一個位置因此被兩種視窗基底讀過；每一組競爭的讀法用自己的結構檢查決定（目錄 checksum、條目與子目錄指標是否解得出來、目錄表是否落在自己的條目裡）：這個樣本的每一組都是恰好一種通過，
  採用它、另一種標「未採用」（19 個目錄紀錄中 17 個採用、2 個未採用，78 個 PSP 版本進 SBOM）。
  已讀出但沒有獨立佐證所以不寫進 expected：PSP 韌體條目的標頭版本（bootloader、SMU、ABL…，沒有找到可對照的公開來源）；
  其他微碼 patch（只有下面兩份在 linux-firmware 找得到位元組相同的）；equivalence id 對應的 CPUID（映像裡的微碼是單獨的 patch，沒有等價表）。
  ASUS 之後若移除舊版，網址會失效，firmware-fetch 會 FAIL，此時換同系列其他版本（BIOS 3404 的 release notes 才有 AGESA 版本佐證，換版本要重新核對）。
expected:
  # AGESA：ASUS 官方下載頁 BIOS 3404（2023/10/31）的 release notes 寫 "1. Update AGESA version to ComboV2PI 1.2.0.B"
  # （https://www.asus.com/motherboards-components/motherboards/prime/prime-b550m-a/helpdesk_bios/ ，2026-11-13 查）。
  # 映像讀到的字串是 "ComboAM4v2PI 1.2.0.B"（名稱寫法與 ASUS 不同），所以只比 PI 版本號。
  amd_agesa: "1.2.0.B"
  # 微碼：映像裡這兩份 patch 與 linux-firmware（AMD 提供、LICENSE.amd-ucode 允許散布）的 amd-ucode/microcode_amd_fam17h.bin
  # 位元組相同（patch 區段 SHA-256 c00b6b19fd5c… 與 689883cd220d…）。出處：
  # https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/amd-ucode/microcode_amd_fam17h.bin?id=c4586ffaac0ca0d7045e06140b6426f2e79e96e6
  # （commit c4586ffaac0c "linux-firmware: Update AMD cpu microcode"，2019-12-18；檔案 6476 位元組，SHA-256 5288d1ac…ddd2；
  # 該檔的等價表把 0x8012 對到 CPUID 00800F12、0x8082 對到 00800F82）。
  amd_microcode:
    - {equiv_id: "0x8012", patch_id: "0x08001250"}
    - {equiv_id: "0x8082", patch_id: "0x0800820d"}
  # 規則表建議（tools/cra/data/fw-advisory-rules.json，2026-11-14 整理）：AGESA ComboAM4v2PI 1.2.0.B 不低於 AMD-SB-7005 的 1.2.0.B，
  # 低於 AMD-SB-7014 的 1.2.0.Cc（取同表最高；Cb 以上的列另有 Ryzen 5000 的 1.2.0.Cb）。只是建議，是否受影響以 AMD 公告為準；規則表改了要重新核對。
  # 公告頁：AMD-SB-7005 https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7005.html、AMD-SB-7014 https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7014.html
  # 微碼（第二批）：equivalence id 0x8012 的 patch 0x08001250 低於 AMD-SB-7014（0x0800126F）與 AMD-SB-7033（0x08001278）列的最低 patch level；公告把這兩個值列在資料中心 Naples 的 CPUID 00800F12 底下，
  # equivalence id 0x8012 對 CPUID 00800F12 的依據是上面的 linux-firmware 等價表；規則只按 equivalence id 比，公告沒有說這個映像的 CPU 是不是 Naples，所以只是建議。
  # 0x8082（CPUID 00800F82）公告沒有列，維持 NOT_ASSESSED（no-rule-for-line）。公告頁：AMD-SB-7033 https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7033.html
  advisory_rule:
    - {component: "AMD AGESA", version: "ComboAM4v2PI 1.2.0.B", suggestion: affected, rule_ids: ["AMD-SB-7014"]}
    - {component: "AMD CPU microcode (equivalence id 0x8012)", version: "0x08001250", suggestion: affected, rule_ids: ["AMD-SB-7014", "AMD-SB-7033"]}
    - {component: "AMD CPU microcode (equivalence id 0x8082)", version: "0x0800820d", suggestion: NOT_ASSESSED, rule_ids: []}
    - {component: "AMI Aptio V core", version: "5.17", suggestion: affected, rule_ids: ["AMI-SA-2026001", "AMI-SA-2026002"]}
  # AMI 核心版本（映像的 Firmware ID 紀錄 $FID；結構從公開映像反推，值是映像自述、沒有簽章；說明 docs/notes/c2-ami-core.md）：
  # 專案版本 34.04 與 ASUS 的 BIOS 版本 3404 一致，所以欄位順序有佐證；核心版本 5.17 本身沒有廠商公布的獨立佐證，這裡只鎖定工具讀到的值。
  # 規則表建議：核心低於 AMI-SA-2026001／2026002 的 AptioV_5.044 → affected 建議；核心是基底版本，板廠回補的修正看不出來，
  # 核心寫法的對應（A1）尚未經 AMI 或板廠確認，這是請負責單位對照板廠公告的線索，不是漏洞判定。
  ami_core: {status: read, version: "5.17", product: "Aptio V", bios_tag: ["A5090"], project_version: "34.04"}
