  實際 vBIOS 映像可能壓縮在檔內。
  GAP（獨立 vBIOS 映像）：沒有找到官方可合法下載、可直接讀出 vBIOS 版本的檔案。
  之後用合成的 option ROM 測流程；實際檔案由負責單位提供。
  不使用 TechPowerUp 等 vBIOS 收藏站（非官方來源）。
