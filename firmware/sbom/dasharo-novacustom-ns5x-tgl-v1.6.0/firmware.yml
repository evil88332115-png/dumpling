# 供應商 SBOM 的品質問題，不是 dumpling 的錯：dumpling 不修改供應商的檔案。上傳臨時 DT 會被 DT 的 CycloneDX schema 驗證拒收（http=400）；
# 這裡宣告預期結果，firmware-dt 的 report 照實標 FAIL 但註明「與宣告一致」、不讓 job 失敗。供應商修好、上傳成功時會變 MISMATCH（回來更新這個欄位）。
expected_dt:
  upload: rejected
  reason: "DT 5.2.0 回 http=400（Schema validation failed）；CycloneDX 1.4 schema 不符：components[0].licenses[18].license 只有 url（缺 id 或 name），頂層多出 platform、firmware_version"
license:
  name: 未聲明
  url: https://docs.dasharo.com/
  note: 檔案沒有授權欄位、Dasharo 文件站未見明確聲明；只在 CI 下載讀取、不重新散布。
notes: |
  PLAN B 段「第二條路」的公開韌體 SBOM 範例：3mdeb 每個 Dasharo 版本旁附的 CycloneDX 1.4 SBOM（10 個元件）。
  用途是驗證供應商 SBOM 的品質檢查（firmware-sbom-check.sh），不是這個型號的掃描結果。
  部分元件沒有 CPE 或版本，品質檢查預期回 ATTENTION。
