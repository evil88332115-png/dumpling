# 原檔不符 CycloneDX 1.4 schema（供應商的品質問題，不是 dumpling 的錯；DT 5.2.0 原樣上傳會回 http=400 Schema validation failed）：
# 頂層多出 platform、firmware_version，components[0]（coreboot）的 licenses[18] 只有 url、沒有 id 或 name。
# dumpling 不改原檔，prep 只在上傳用的副本做最小正規化（pipeline/lib/firmware_sbom_normalize.py）：兩個頂層欄位搬到 metadata.properties
# （dumpling:supplier-extra:<名稱>），那筆 license 從 licenses 移除、url 存進元件 property（dumpling:supplier-license-url）；
# 不補猜的值，每一筆留在 normalize.json（原指標、新位置、原值 SHA-256）。因此這個樣本預期上傳成功，不宣告 expected_dt。
# 供應商哪天修好，副本不會有變更（normalize.json 的 changes 為空）；正規化後仍被 DT 拒收（別種違規）就是一般 FAIL。
license:
  name: 未聲明
  url: https://docs.dasharo.com/
  note: 檔案沒有授權欄位、Dasharo 文件站未見明確聲明；只在 CI 下載讀取、不重新散布。
notes: |
  PLAN B 段「第二條路」的公開韌體 SBOM 範例：3mdeb 每個 Dasharo 版本旁附的 CycloneDX 1.4 SBOM（10 個元件）。
  用途是驗證供應商 SBOM 的品質檢查（firmware-sbom-check.sh），不是這個型號的掃描結果。
  部分元件沒有 CPE 或版本，品質檢查預期回 ATTENTION。
  上傳臨時 DT 的是正規化副本（原檔不符 schema，見上方註解）。
