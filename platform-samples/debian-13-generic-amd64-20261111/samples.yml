notes: |
  OS 層用 Debian 官方雲端映像（cloud.debian.org 長期保留舊版本）；核心原始碼用 snapshot.debian.org 的固定網址
  （deb.debian.org／security.debian.org 換版後舊檔會被移走）。
  不用 OpenMediaVault 的安裝 ISO：它是安裝程式，要得到裝好的系統就必須執行它，違反「只解開、不執行」（D-025）。
  分層寫在 project.yml 的角色裡，不寫死在平台設定；自有品牌的 NAS，OS 層也算我們的待辦。
