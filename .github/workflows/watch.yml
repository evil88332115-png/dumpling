name: watch
# 每日監控（PLAN「E. 監控與通知」、docs/WATCH.md）。排程每天一輪 real；手動觸發可選 drill（合成資料的演練：建基準 → 開 1 個 → 不重複 → 關閉）。
# 權限照 D-012：預設唯讀；compute 只讀（另有 actions: read 查上一次排程的結果），notify 與 drill-close（關閉演練 Issue）有 issues: write，keepalive 只有 actions: write。
# 呼叫 watch-round 的 job 宣告 issues: write 是給被呼叫 workflow 的上限，實際生效的是 watch-round 裡各 job 自己的宣告。
# 公開 repo 只做演練與公開資料；GitLab 階段「已被利用」的真實案件一律用私有 Issue（docs/GITLAB-PORT.md）。
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: drill（演練）或 real（真實監控）
        type: choice
        options: [drill, real]
        default: drill
      dry_run:
        description: 只算不寫（不開 Issue、不寫狀態）
        type: boolean
        default: false
      baseline:
        description: real 而且還沒有狀態時，建立第一次的基準（要明確勾選；狀態 Issue 不見時不會自動重建）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 依 ref 分組：分支上的手動演練不會取消 main 的排程（同一群組只保留 1 個排隊者，新的會取消舊的排隊者）。
  # 排程那一輪如果還是被取消，下一輪的 compute 會查到（上一次排程的結果算降級），keepalive 也會印出來。
  group: watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real:
    if: github.event_name == 'schedule' || inputs.mode == 'real'
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/watch-round.yml
    with:
      mode: real
      round: real
      allow_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline == true }}
      # D-040：排程的 real 預設只算不寫，C0 看過第一次真實基準後把 repo 變數 WATCH_REAL_ISSUES 設成 on 才開 Issue；手動觸發照輸入
      dry_run: ${{ (github.event_name == 'schedule' && vars.WATCH_REAL_ISSUES != 'on') || inputs.dry_run == true }}

  drill-1-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'drill'
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/watch-round.yml
    with:
      mode: drill
      allow_baseline: true
      round: drill-1
      overlay: false
      expect_opened: 0
      dry_run: ${{ inputs.dry_run == true }}

  # 合成 KEV（requests 的 CVE-2018-18074）同時在正式版 drill-demo/v1.0.0（bsp 層）與開發版 dev/drill-demo（product 層）→ 預期 2 個 Issue
  drill-2-new-kev:
    needs: drill-1-baseline
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/watch-round.yml
    with:
      mode: drill
      allow_baseline: true
      round: drill-2
      overlay: true
      expect_opened: ${{ inputs.dry_run == true && -1 || 2 }}
      dry_run: ${{ inputs.dry_run == true }}

  drill-3-repeat:
    needs: drill-2-new-kev
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/watch-round.yml
    with:
      mode: drill
      allow_baseline: true
      round: drill-3
      overlay: true
      expect_opened: ${{ inputs.dry_run == true && -1 || 0 }}
      dry_run: ${{ inputs.dry_run == true }}

  drill-close:
    needs: drill-3-repeat
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'drill' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 關閉演練 Issue（換成 *-done 標籤）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I pipeline/watch/issues.py close-drill --repo "$GITHUB_REPOSITORY"

  keepalive:
    if: github.event_name == 'schedule' || inputs.mode == 'real'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 讀 workflow 狀態並重新啟用（防 60 天停用；官方沒有定義 activity，見 WATCH.md 第 4 節）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml"
          echo "watch.yml state（enable 之前）：$(gh api "$api" --jq .state)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "最近的排程 run：$(gh api "$api/runs?event=schedule&branch=main&per_page=3" --jq '[.workflow_runs[] | "\(.id) \(.status)/\(.conclusion // "-") \(.created_at)"] | join("；")')" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api -X PUT "$api/enable"
          echo "watch.yml state（enable 之後）：$(gh api "$api" --jq .state)" | tee -a "$GITHUB_STEP_SUMMARY"
