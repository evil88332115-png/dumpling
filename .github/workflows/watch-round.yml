name: watch-round
# 每日監控的一輪（docs/WATCH.md 第 3 節）：compute（只讀）→ notify（只有 issues: write）。由 watch.yml 呼叫，不單獨觸發。
# 公開 repo 一律 --demo：Issue 標明「示範專案（公開 BSP）」、加 demo 標籤（D-040）。
on:
  workflow_call:
    inputs:
      mode:
        description: real 或 drill
        type: string
        required: true
      round:
        description: 這一輪的名稱（artifact 名稱用）
        type: string
        required: true
      overlay:
        description: drill 時是否併入合成 KEV（tests/fixtures/watch/drill-kev-overlay.json）
        type: boolean
        default: false
      expect_opened:
        description: drill 的驗收：這一輪應該開出幾個 Issue（-1＝不檢查）
        type: number
        default: -1
      dry_run:
        type: boolean
        default: false
      allow_baseline:
        description: 還沒有狀態時，允許建立第一次的基準（real 只在手動 baseline=true 時給；drill 一律給）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-24.04
    # 核心 CVE clone 最壞約 47 分鐘（3 次 × 900 秒＋等待）、Grype DB 最多 15 分鐘、Grype 比對合計上限 25 分鐘，加上其他步驟
    timeout-minutes: 150
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      has_plan: ${{ steps.match.outputs.has_plan }}
      has_support_plan: ${{ steps.support.outputs.has_plan }}
      support_status: ${{ steps.support.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 工具（Syft、Grype 固定版本＋bubblewrap）
        run: |
          bash tools/e2e/install-tools.sh "$RUNNER_TEMP/tools/bin" "$RUNNER_TEMP/tools/versions.txt" --sbom-only
          sudo install -m 0755 -t /usr/local/bin "$RUNNER_TEMP/tools/bin/grype"
          grype version | head -n 3
      # 上一份核心 CVE 鏡像：跟 pipeline.yml 同一個 key 前綴與路徑（cache 的版本含路徑），Release 掃描與每日監控互相沿用。
      # 上游沒變就沿用；git.kernel.org 連不上就用 48 小時內的上一份頂替（ATTENTION，報告與 Issue 會寫出來）。演練不下載核心 CVE。
      - name: 還原上一份核心 CVE 鏡像（real；有 cache 才有）
        if: inputs.mode == 'real'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kcve-cache/kcve
          key: kernel-cve-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kernel-cve-mirror-
      # 資料源自己的逾時：卡住時（例如上游連不上、鏡像腳本沒有整體逾時）這一步失敗但 job 繼續，後面照樣比對、留下報告
      # （缺的資料源在報告標 GAP／NOT_RUN；CISA KEV 與 EUVD 都沒有就 FAIL）。不完整的鏡像下一步刪掉，不會被讀到。
      - name: 資料源（CISA KEV、EUVD、核心 CNA、Grype DB）
        id: feeds
        timeout-minutes: 100
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
          KCVE_CACHE_DIR: ${{ runner.temp }}/kcve-cache/kcve
        run: |
          extra=()
          if [ "$MODE" = drill ]; then extra=(--no-kernel-cve --no-euvd); fi
          pipeline/watch/feeds.sh "$RUNNER_TEMP/w/feeds" "${extra[@]}"
      - name: 資料源沒有完成時刪掉不完整的鏡像（沒有 .result 的鏡像不能讀）
        if: steps.feeds.outcome != 'success'
        run: |
          w="$RUNNER_TEMP/w/feeds"; mkdir -p "$w"
          for n in euvd kernel-cve; do [ -f "$w/$n.result" ] || rm -rf "${w:?}/$n"; done
          printf 'feeds\tFAIL\t資料源步驟沒有完成（逾時或失敗）：缺的資料源在報告標 GAP／NOT_RUN\n' >> "$w/feeds.tsv"
          echo "::warning::資料源步驟沒有完成（逾時或失敗），照樣比對並留下報告"
      - name: 核心 CVE 鏡像是不是這次新抓的（只有新抓的才存 cache，頂替用的舊資料不存回去）
        id: kcve-fresh
        if: inputs.mode == 'real' && steps.feeds.outcome == 'success'
        env:
          KCVE_CACHE_DIR: ${{ runner.temp }}/kcve-cache/kcve
        run: |
          export MIRRORS_DIR="$RUNNER_TEMP/w/feeds"
          . pipeline/lib/mirrors.sh
          if mirror_is_fresh kernel-cve; then
            rm -rf "$KCVE_CACHE_DIR"; mkdir -p "$(dirname "$KCVE_CACHE_DIR")"; cp -a "$MIRRORS_DIR/kernel-cve" "$KCVE_CACHE_DIR"
            echo "fresh=true" >> "$GITHUB_OUTPUT"; du -sh "$KCVE_CACHE_DIR"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "核心 CVE 鏡像不是這次新抓的（或沒有）：不存 cache"
          fi
      - name: 存核心 CVE 鏡像（cache；新抓的才存，GitHub 會淘汰舊的）
        if: inputs.mode == 'real' && steps.kcve-fresh.outputs.fresh == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kcve-cache/kcve
          key: kernel-cve-mirror-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 收集 Release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = drill ]; then src=(--from-dir tests/fixtures/watch/drill); else src=(--repo "$GITHUB_REPOSITORY"); fi
          set +e; python3 -I pipeline/watch/collect.py "${src[@]}" --out "$RUNNER_TEMP/w/inv"; rc=$?; set -e
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit "$rc"
      - name: 讀狀態 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: python3 -I pipeline/watch/issues.py read-state --repo "$GITHUB_REPOSITORY" --mode "$MODE" --out "$RUNNER_TEMP/w/state"
      - name: 上一次排程的結果（real；被取消或沒跑要留下紀錄）
        if: inputs.mode == 'real'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml/runs?event=schedule&branch=main&per_page=5" \
            --jq '{runs: [.workflow_runs[] | {id, status, conclusion, created_at}]}' > "$RUNNER_TEMP/w/prev-schedule.json" \
            || echo '{"error": "查不到上一次排程（API 失敗）"}' > "$RUNNER_TEMP/w/prev-schedule.json"
      # 支援期限與 EOL（M8 B2，docs/WATCH.md 第 7 節）：只在 real。這一步 FAIL 不擋每日監控的 Issue（continue-on-error），
      # FAIL 由 support-fail job 讓這一輪變紅。放在比對前面，報告一定會留在 summary；但比對 FAIL 時 compute 失敗、notify 不跑，
      # 支援期限的 Issue 延到下一輪（key 不變，不會漏，只是晚一天）。plan 是 stateless，Issue 用自己的標記與 support-period 標籤，
      # 不是監控 Issue、不碰監控的狀態 Issue。
      - name: PyYAML（支援期限檢查讀 project.yml 要用；runner 映像內建）
        if: inputs.mode == 'real'
        continue-on-error: true
        run: python3 -I -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: 支援期限與 EOL（real）
        id: support
        if: inputs.mode == 'real'
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python3 -I pipeline/watch/support.py --inventory "$RUNNER_TEMP/w/inv/inventory.json" --out "$RUNNER_TEMP/w/support" --run-url "$RUN_URL" --demo
          rc=$?
          set -e
          if [ -f "$RUNNER_TEMP/w/support/report.md" ]; then cat "$RUNNER_TEMP/w/support/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$RUNNER_TEMP/w/support/plan.json" ]; then echo "has_plan=true" >> "$GITHUB_OUTPUT"; else echo "has_plan=false" >> "$GITHUB_OUTPUT"; fi
          case $rc in 0) st=OK ;; 2) st=ATTENTION ;; *) st=FAIL ;; esac
          echo "status=$st" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || [ "$rc" = 2 ] || { echo "::error::支援期限檢查 FAIL（結束碼 $rc）"; exit "$rc"; }
      - name: 比對
        id: match
        env:
          MODE: ${{ inputs.mode }}
          OVERLAY: ${{ inputs.overlay }}
          EXPECT: ${{ inputs.expect_opened }}
          ALLOW_BASELINE: ${{ inputs.allow_baseline }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ov=()
          if [ "$OVERLAY" = true ]; then ov=(--kev-overlay tests/fixtures/watch/drill-kev-overlay.json); fi
          if [ "$ALLOW_BASELINE" = true ]; then ov+=(--allow-baseline); fi
          if [ -f "$RUNNER_TEMP/w/prev-schedule.json" ]; then ov+=(--prev-schedule "$RUNNER_TEMP/w/prev-schedule.json" --run-id "$GITHUB_RUN_ID"); fi
          set +e
          python3 -I pipeline/watch/match.py --inventory "$RUNNER_TEMP/w/inv/inventory.json" --state-dir "$RUNNER_TEMP/w/state" \
            --feeds "$RUNNER_TEMP/w/feeds" --out "$RUNNER_TEMP/w/out" --mode "$MODE" --run-url "$RUN_URL" --demo "${ov[@]}"
          rc=$?
          set -e
          if [ -f "$RUNNER_TEMP/w/out/report.md" ]; then cat "$RUNNER_TEMP/w/out/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          { echo; echo '```'; cat "$RUNNER_TEMP/w/feeds/feeds.tsv"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          # 0 OK、2 ATTENTION、3 GAP（還沒有可監控的 Release：不建基準、不產生 plan）都不算失敗；只有 1 FAIL 讓 job 變紅
          if [ -f "$RUNNER_TEMP/w/out/plan.json" ]; then echo "has_plan=true" >> "$GITHUB_OUTPUT"; else echo "has_plan=false" >> "$GITHUB_OUTPUT"; fi
          [ "$rc" = 0 ] || [ "$rc" = 2 ] || [ "$rc" = 3 ] || exit "$rc"
          # 演練一定要有 plan：沒有 plan（例如 fixtures 壞掉 → GAP）時 notify 會跳過，驗收等於沒做 → 失敗
          if [ "$EXPECT" -ge 0 ] && [ ! -f "$RUNNER_TEMP/w/out/plan.json" ]; then echo "drill: 沒有 plan.json（match 結束碼 $rc），驗收不能跳過" >&2; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watch-plan-${{ inputs.round }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/w/out/plan.json
            ${{ runner.temp }}/w/out/report.md
            ${{ runner.temp }}/w/out/result.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'real'
        with:
          name: watch-support-${{ inputs.round }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/w/support/plan.json
            ${{ runner.temp }}/w/support/report.md
            ${{ runner.temp }}/w/support/result.json
          retention-days: 14
          if-no-files-found: warn

  # 支援期限檢查 FAIL（例如 project.yml 不合格、資料表壞掉）：讓這一輪變紅，但不擋 notify（每日監控的 Issue 照開）
  support-fail:
    needs: compute
    if: needs.compute.outputs.support_status == 'FAIL'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          echo "::error::支援期限與 EOL 檢查 FAIL：看 compute 的『支援期限與 EOL』步驟與 watch-support artifact"
          exit 1

  notify:
    needs: compute
    if: needs.compute.outputs.has_plan == 'true' || needs.compute.outputs.has_support_plan == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.compute.outputs.has_plan == 'true'
        with:
          name: watch-plan-${{ inputs.round }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: 套用 Issue 動作與狀態
        if: needs.compute.outputs.has_plan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode }}
        run: |
          d=()
          if [ "$DRY" = true ]; then d=(--dry-run); fi
          python3 -I pipeline/watch/issues.py apply --repo "$GITHUB_REPOSITORY" --plan "$RUNNER_TEMP/plan/plan.json" --mode "$MODE" "${d[@]}"
      # 支援期限的 Issue：同一個 dry_run（排程預設只算不寫，D-040）；stateless plan，不碰監控的狀態 Issue
      # !cancelled()：上面每日監控的 apply 失敗（例如樂觀鎖）時，支援期限的 Issue 照樣套用
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() && needs.compute.outputs.has_support_plan == 'true' }}
        with:
          name: watch-support-${{ inputs.round }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/support
      # C0 決定（D-040 的精神，2026-11-14）：C0 放行（repo 變數 WATCH_REAL_ISSUES=on）之前，支援期限的 Issue 一律只算不寫——手動跑、dry_run=false 也一樣
      - name: 套用支援期限的 Issue
        if: ${{ !cancelled() && needs.compute.outputs.has_support_plan == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run || vars.WATCH_REAL_ISSUES != 'on' }}
        run: |
          d=()
          if [ "$DRY" = true ]; then d=(--dry-run); fi
          python3 -I pipeline/watch/issues.py apply --repo "$GITHUB_REPOSITORY" --plan "$RUNNER_TEMP/support/plan.json" --mode real "${d[@]}"
      - name: 演練驗收（這一輪開出的 Issue 數）
        if: inputs.expect_opened >= 0 && needs.compute.outputs.has_plan == 'true'
        env:
          WANT: ${{ inputs.expect_opened }}
        run: |
          got=$(python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); print(sum(1 for a in r["actions"] if a.get("result") in ("opened","would_open")))' "$RUNNER_TEMP/plan/apply-result.json")
          echo "drill: 開出 $got 個 Issue（預期 $WANT）" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$WANT" ]
