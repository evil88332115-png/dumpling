name: m2-probe
# 暫時的探測（M2 J 軌開發用，完成後刪除）：只讀 BSP 與範例 rootfs 的 tar 成員清單與核心 deb 的內容清單，不解開、不執行。
on:
  push:
    paths: [".github/workflows/m2-probe.yml"]
    branches: ["wp1/m2-jetson"]
permissions:
  contents: read
jobs:
  relprobe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: release API 探測（只建 draft，用完刪）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "== GET releases"; gh api "repos/$GITHUB_REPOSITORY/releases" --jq 'length'; echo "rc=$?"
          echo "== GET releases --paginate"; gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[]|select(.draft)|.tag_name'; echo "rc=$?"
          echo "== create draft"; echo hi > a.txt
          gh release create "m2-probe/test" a.txt --draft --target "$GITHUB_SHA" --title probe --notes probe --repo "$GITHUB_REPOSITORY"; echo "rc=$?"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[]|select(.draft and .tag_name=="m2-probe/test")|.id'); do echo "delete $id"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; echo "rc=$?"; done
  patchprobe:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 核心原始碼＋候選修補
        run: |
          set +e +o pipefail
          W=$RUNNER_TEMP/pp; mkdir -p $W/dl && cd $W
          curl -fsSL -o dl/public_sources.tbz2 https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/sources/public_sources.tbz2
          echo "8346f0371649a92c42293b2d4a7bf3d69e4dd1de23009e1463ea910994a81371  dl/public_sources.tbz2" | sha256sum -c -
          python3 -I $GITHUB_WORKSPACE/pipeline/lib/safe_extract.py dl/public_sources.tbz2 ps
          python3 -I $GITHUB_WORKSPACE/pipeline/lib/safe_extract.py ps/Linux_for_Tegra/source/kernel_src.tbz2 src
          ls src src/kernel
          head -8 src/kernel/kernel-noble/Makefile
          git -c protocol.allow=never -c protocol.https.allow=always clone -q --depth 1 https://git.kernel.org/pub/scm/linux/security/vulns.git vulns
          python3 -I $GITHUB_WORKSPACE/.github/probe/find_patch.py src/kernel/kernel-noble vulns $W/cand
          ls -l $W/cand | head -40
          for f in $W/cand/*.patch; do echo "=== $f"; cat "$f"; done | head -400
  probe:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: 下載 BSP 並核對
        run: |
          set +e +o pipefail
          mkdir -p "$RUNNER_TEMP/p" && cd "$RUNNER_TEMP/p"
          curl -fsSL -o bsp.tbz2 https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/release/Jetson_Linux_R39.2.1_aarch64.tbz2
          echo "2e5619088ba88e85dab25247f033d70659b6f676ff835176a07766dcb0fdbe6b  bsp.tbz2" | sha256sum -c -
          tar -tvjf bsp.tbz2 > bsp.list
          wc -l bsp.list
          echo "== 最上層與 kernel／bootloader／rootfs"
          awk '{print $6}' bsp.list | grep -E '^Linux_for_Tegra/[^/]+/?$' | grep -v '\.conf$' | head -80
          echo "== kernel/"; grep -E ' Linux_for_Tegra/kernel/' bsp.list | awk '{print $3, $6}' | head -80
          echo "== rootfs/"; grep -E ' Linux_for_Tegra/rootfs/' bsp.list | awk '{print $1, $3, $6}' | head -20
          echo "== deb 清單"; grep -E '\.deb$' bsp.list | awk '{print $3, $6}'
          echo "== bootloader/ 第一層"; grep -E ' Linux_for_Tegra/bootloader/[^/]+$' bsp.list | awk '{print $3, $6}' | head -80
      - name: 核心 deb 內容
        run: |
          set +e +o pipefail
          cd "$RUNNER_TEMP/p"
          mkdir kd
          tar -xjf bsp.tbz2 -C kd --wildcards 'Linux_for_Tegra/kernel/*.deb' 'Linux_for_Tegra/kernel/Image' 'Linux_for_Tegra/kernel/dtb/*' 2>&1 | tail -3 || true
          ls -l kd/Linux_for_Tegra/kernel | head -50
          for d in kd/Linux_for_Tegra/kernel/*.deb; do
            echo "=== $d"; dpkg-deb -f "$d" Package Version Architecture Depends
            dpkg-deb -c "$d" | awk '{print $1, $3, $6}' | grep -vE '\.ko$|/kernel/' | head -40
            echo "ko 數：$(dpkg-deb -c "$d" | grep -c '\.ko')"
            dpkg-deb -c "$d" | grep -E '\.ko' | awk '{print $6}' | sed -E 's|/[^/]+$||' | sort | uniq -c | sort -rn | head -25
          done
          sha256sum kd/Linux_for_Tegra/kernel/Image 2>/dev/null || true
          file kd/Linux_for_Tegra/kernel/Image 2>/dev/null || true
          strings -a kd/Linux_for_Tegra/kernel/Image 2>/dev/null | grep -m2 'Linux version' || true
      - name: 範例 rootfs 的 boot 與 modules
        run: |
          set +e +o pipefail
          cd "$RUNNER_TEMP/p"
          curl -fsSL -o rfs.tbz2 https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/release/Tegra_Linux_Sample-Root-Filesystem_R39.2.1_aarch64.tbz2
          echo "58a6485b56c6d6b5ee8478e902eed0ed4984fd73135b88b76aeaa5c1f44be66e  rfs.tbz2" | sha256sum -c -
          tar -tvjf rfs.tbz2 > rfs.list
          wc -l rfs.list
          echo "== boot"; grep -E '^[^ ]+ [^ ]+ +[0-9]+ [^ ]+ [^ ]+ (\./)?boot(/|$)' rfs.list | head -30
          echo "== modules"; grep -E 'lib/modules' rfs.list | head -20
          echo "== usr/lib/modules"; grep -E 'usr/lib/modules' rfs.list | head -20
          echo "== top"; awk '{print $6}' rfs.list | grep -E '^(\./)?[^/]+/?$' | head -40
