name: m2-probe
# 暫時的探測（M2 J 軌開發用，完成後刪除）：只讀 BSP 與範例 rootfs 的 tar 成員清單與核心 deb 的內容清單，不解開、不執行。
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/m2-probe.yml"]
    branches: ["wp1/m2-jetson"]
permissions:
  contents: read
jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - run: sleep 3720
  relprobe:
    needs: wait
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: 一小時以後的 Release API
        env:
          GH_TOKEN: ${{ github.token }}
          T: m2-probe/age-test
        run: |
          set +e
          echo hi > a.txt
          echo "== list"; gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name==\"$T\") | .id"; echo "rc=$?"
          echo "== create"; gh release create "$T" a.txt --draft --target "$GITHUB_SHA" --title probe --notes probe --repo "$GITHUB_REPOSITORY"; echo "rc=$?"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name==\"$T\") | .id"); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; echo "del rc=$?"; done
