name: pipeline

# 共用的 build＋scan（reusable workflow）：release.yml 與 dev.yml 都呼叫它，專案與平台由 project.yml 決定，新增專案或平台不用改這裡。
#   plan ：讀 platform.yml（pipeline/project-info.py）：build.mode（compile｜none）、build.runner、build.apt、scan.runner、scan.apt、arch
#   build：build.mode＝compile 才跑（none 時整個略過）；runner 與 apt 清單來自 platform.yml（Jetson：arm64 原生編譯，約 36 分鐘）。
#          build 步驟把要交給 scan 的東西全部放在 $DUMPLING_OUT/handoff/，workflow 整個資料夾上傳、在 scan job 放回同一個路徑（不指名任何檔案）
#   scan ：build 略過（none 或沿用別的 run 的 artifact）也會跑，build 失敗或被取消就不跑；重新 fetch → assemble → 臨時 DT → scan → 分層 → 報告 → 標準答案比對 → artifact
# 這裡的 job 都只有唯讀權限（D-012）；建 Release 的 job 在 release.yml。
# 建置不可重現：建置紀錄與刷機包裡的核心必須來自同一次編譯，所以 build 的結果用 artifact 傳給 scan，不重編、不以雜湊當 cache key。
on:
  workflow_call:
    inputs:
      project:
        description: "專案名稱（projects/ 底下的資料夾）"
        type: string
        required: true
      version:
        description: "版本（sources.yml 的版本，例如 v39.2.1-demo1）"
        type: string
        required: true
      stop_after:
        description: "build｜all（開發時只跑編譯用）"
        type: string
        default: all
      reuse_build_run:
        description: "開發用：沿用另一個 run 的 build artifact（空白＝重新編譯）；只有 workflow_dispatch 會傳"
        type: string
        default: ""
    outputs:
      scan_artifact:
        description: "scan 的結果 artifact 名稱"
        value: ${{ jobs.scan.outputs.artifact }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DUMPLING_PROJECT_DIR: projects/${{ inputs.project }}

jobs:
  plan:
    name: plan (${{ inputs.project }} ${{ inputs.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      BUILD_MODE: ${{ steps.p.outputs.BUILD_MODE }}
      BUILD_RUNNER: ${{ steps.p.outputs.BUILD_RUNNER }}
      BUILD_APT: ${{ steps.p.outputs.BUILD_APT }}
      SCAN_RUNNER: ${{ steps.p.outputs.SCAN_RUNNER }}
      SCAN_APT: ${{ steps.p.outputs.SCAN_APT }}
      SCAN_TOOLS: ${{ steps.p.outputs.SCAN_TOOLS }}
      ARCH: ${{ steps.p.outputs.ARCH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: platform.yml 的規劃值
        id: p
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
        run: |
          # 值只含安全字元（project-info.py 驗證過 apt 套件名稱與 runner 標籤），可直接寫進 GITHUB_OUTPUT
          python3 -I pipeline/project-info.py --dir "projects/$PROJECT" "$VERSION" | tee info.txt
          grep -E '^(BUILD_MODE|BUILD_RUNNER|BUILD_APT|SCAN_RUNNER|SCAN_APT|SCAN_TOOLS|ARCH)=' info.txt >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ inputs.project }} ${{ inputs.version }})
    needs: plan
    # build.mode＝none 的平台整個略過；開發時沿用別的 run 的 artifact 也略過
    if: ${{ needs.plan.outputs.BUILD_MODE == 'compile' && inputs.reuse_build_run == '' }}
    runs-on: ${{ needs.plan.outputs.BUILD_RUNNER }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 路徑
        run: |
          # 輸出放 RUNNER_TEMP 底下（路徑不含 ..）；交給 scan 的東西都在 $DUMPLING_OUT/handoff/
          echo "DUMPLING_OUT_BASE=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: 相依套件（platform.yml 的 build.apt）
        env:
          BUILD_APT: ${{ needs.plan.outputs.BUILD_APT }}
        run: |
          if [ -n "$BUILD_APT" ]; then
            sudo apt-get update -qq
            # shellcheck disable=SC2086 — 套件名稱已由 project_config 驗證（小寫英數與 + . -）
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $BUILD_APT > /dev/null
          fi

      - name: 驗證專案設定
        run: bash pipeline/run-step.sh validate "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}"

      - name: fetch（下載並核對 sha256；只下載、不解開、不執行）
        run: bash pipeline/run-step.sh fetch "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}"

      - name: build
        run: bash pipeline/run-step.sh build "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}" | tee "$RUNNER_TEMP/build-line.txt"

      - name: 摘要（build.sh 寫的 handoff/build-summary.md；沒有就用最後一行）
        run: |
          o="$DUMPLING_OUT_BASE/${{ inputs.project }}/${{ inputs.version }}"
          ls -l "$o/handoff"
          {
            echo "## build（${{ inputs.project }} ${{ inputs.version }}）"
            if [ -f "$o/handoff/build-summary.md" ]; then cat "$o/handoff/build-summary.md"; else tail -n 1 "$RUNNER_TEMP/build-line.txt"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: artifact（build 交給 scan 的整個 handoff 資料夾；只保留 1 天）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ inputs.project }}-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/out/${{ inputs.project }}/${{ inputs.version }}/handoff
            ${{ runner.temp }}/out/${{ inputs.project }}/${{ inputs.version }}/pipeline-steps.tsv
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  scan:
    name: scan (${{ inputs.project }} ${{ inputs.version }})
    needs: [plan, build]
    # plan 成功；build 成功，或被略過（build.mode＝none、或開發時沿用別的 run 的 artifact）也要跑；build 失敗或被取消就不跑
    if: ${{ !cancelled() && inputs.stop_after != 'build' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ needs.plan.outputs.SCAN_RUNNER }}
    timeout-minutes: 240
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 路徑
        run: |
          # 輸出放 RUNNER_TEMP 底下（路徑不含 ..）；pilot.env 單獨一個資料夾（sca-scan 的沙箱會遮蔽 PILOT_ENV 所在的整個資料夾）
          echo "DUMPLING_OUT_BASE=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "PILOT_ENV=$RUNNER_TEMP/pilot-env/pilot.env" >> "$GITHUB_ENV"
          # 上一份核心 CVE 鏡像（actions/cache 還原到這裡；cache 的版本含路徑，存和還原要用同一個路徑）
          echo "KCVE_CACHE_DIR=$RUNNER_TEMP/kcve-cache/kcve" >> "$GITHUB_ENV"

      - name: 名稱
        id: names
        run: echo "artifact=scan-${{ inputs.project }}-${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: 取得 build 的 handoff 與步驟紀錄（放回 $DUMPLING_OUT/handoff、$DUMPLING_OUT/pipeline-steps.tsv）
        if: ${{ needs.plan.outputs.BUILD_MODE == 'compile' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ inputs.project }}-${{ inputs.version }}
          path: ${{ runner.temp }}/out/${{ inputs.project }}/${{ inputs.version }}
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: build 沒有執行的紀錄（build.mode 不是 compile）
        if: ${{ needs.plan.outputs.BUILD_MODE != 'compile' }}
        env:
          BUILD_MODE: ${{ needs.plan.outputs.BUILD_MODE }}
        run: |
          bash pipeline/run-step.sh --record "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}" build NOT_RUN 4 "build.mode: $BUILD_MODE"

      - name: "Go（scan.tools 是 full 才需要：govulncheck v1.9.0 要 Go 1.26 以上，runner 內建的比較舊）"
        if: ${{ needs.plan.outputs.SCAN_TOOLS == 'full' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: 安裝掃描工具（platform.yml 的 scan.tools）與 scan.apt
        env:
          SCAN_APT: ${{ needs.plan.outputs.SCAN_APT }}
          SCAN_TOOLS: ${{ needs.plan.outputs.SCAN_TOOLS }}
        run: |
          # install-tools.sh 目前只裝 linux_amd64 的 Syft／Grype：scan.runner＝arm64 還不支援
          [ "$(uname -m)" = x86_64 ] || { echo "scan: FAIL（scan.runner 不是 amd64：tools/e2e/install-tools.sh 只有 amd64 的 Syft／Grype）"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tools"
          # sbom-only（預設）：Syft、Grype、bubblewrap；full：再加 cdxgen、govulncheck、guarddog（版本都固定在 install-tools.sh）。見 pipeline/install-scan-tools.sh
          bash pipeline/install-scan-tools.sh "$SCAN_TOOLS" "$RUNNER_TEMP/tools/versions.txt"
          sudo apt-get update -qq
          # shellcheck disable=SC2086 — scan.apt 的套件名稱已由 project_config 驗證
          sudo apt-get install -y -qq --no-install-recommends bubblewrap python3-yaml $SCAN_APT > /dev/null
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-pid --ro-bind / / --dev /dev --proc /proc true && echo "bubblewrap: OK"

      - name: 驗證專案設定
        run: bash pipeline/run-step.sh validate "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}"

      - name: fetch（重新從來源下載並核對）
        run: bash pipeline/run-step.sh fetch "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}"

      - name: assemble（組產品映像；Jetson：核心與樹外模組換成 build 編的）
        run: bash pipeline/run-step.sh assemble "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}"

      - name: 還原上一份核心 CVE 鏡像（kernel-cves.zip、SOURCE；有 cache 才有）
        id: kcve-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kcve-cache/kcve
          key: kernel-cve-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kernel-cve-mirror-

      - name: scan（臨時 DT → 精靈 → 分層 → 報告 → 標準答案比對）
        env:
          MIRROR_REFRESH_STATUS: ""   # 不檢查常駐環境的鏡像新鮮度
          # 上一份核心 CVE 鏡像：上游沒變就沿用，git.kernel.org 連不上就退而求其次（≤48 小時、通過檢查；結果標 ATTENTION，不擋 Release）
          KCVE_CACHE_DIR: ${{ runner.temp }}/kcve-cache/kcve
        run: bash pipeline/run-step.sh scan "$DUMPLING_PROJECT_DIR" "${{ inputs.version }}"

      - name: 核心 CVE 鏡像是不是這次新抓的（只有新抓的才存 cache，頂替用的舊資料不存回去）
        id: kcve-fresh
        if: ${{ !cancelled() }}
        run: |
          export MIRRORS_DIR="$DUMPLING_OUT_BASE/${{ inputs.project }}/${{ inputs.version }}/mirrors"
          . pipeline/lib/mirrors.sh
          if mirror_is_fresh kcve; then
            rm -rf "$KCVE_CACHE_DIR"; mkdir -p "$(dirname "$KCVE_CACHE_DIR")"; cp -a "$MIRRORS_DIR/kcve" "$KCVE_CACHE_DIR"
            echo "fresh=true" >> "$GITHUB_OUTPUT"; du -sh "$KCVE_CACHE_DIR"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "核心 CVE 鏡像不是這次新抓的（或沒有）：不存 cache"
          fi

      - name: 存核心 CVE 鏡像（cache；每次新抓的存一份，GitHub 會淘汰舊的）
        if: ${{ !cancelled() && steps.kcve-fresh.outputs.fresh == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kcve-cache/kcve
          key: kernel-cve-mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 整理結果（報告 zip、SBOM、VEX、xlsx、摘要）
        if: ${{ always() }}
        run: |
          o="$DUMPLING_OUT_BASE/${{ inputs.project }}/${{ inputs.version }}"
          mkdir -p "$RUNNER_TEMP/result"
          [ -d "$o/release" ] && cp -r "$o/release/." "$RUNNER_TEMP/result/" || true
          for f in handoff/build.json assemble.json scan.json expected-check.txt pipeline-steps.tsv; do [ -f "$o/$f" ] && cp "$o/$f" "$RUNNER_TEMP/result/" || true; done
          [ -f "$o/summary.md" ] && cat "$o/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          # 診斷用（只在 artifact，不進 Release）：精靈輸出裡的小檔（狀態、紀錄、比對結果、報告），不含解開的原始碼與建置紀錄
          if [ -d "$o/wizard-out" ]; then
            mkdir -p "$RUNNER_TEMP/result/diag"
            rsync -a --prune-empty-dirs --max-size=150m --exclude 'src/' --exclude 'buildrecord/' --exclude 'tmp/' --exclude 'wt/' \
              --exclude '*.tar' --exclude '*.tar.gz' --exclude '*.tbz2' "$o/wizard-out/" "$RUNNER_TEMP/result/diag/wizard-out/" || true
            for f in layers/layers.json wizard.log wizard-bsp.log wizard-os.log; do [ -f "$o/$f" ] && cp "$o/$f" "$RUNNER_TEMP/result/diag/" || true; done
            du -sh "$RUNNER_TEMP/result/diag" || true
          fi
          ls -l "$RUNNER_TEMP/result"

      - name: 臨時 DT：down
        if: ${{ always() }}
        run: bash pipeline/dt-ephemeral.sh down || true

      - name: artifact（Release 附件與摘要；dev 版本只保留 7 天）
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-${{ inputs.project }}-${{ inputs.version }}
          path: ${{ runner.temp }}/result
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
