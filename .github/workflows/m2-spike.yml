name: m2-spike

# M2 可行性試驗（spike）：只量測，不是正式流程，不合併到 main。
# 回答：Jetson 的編譯＋掃描能不能在一個 job 的 6 小時、runner 可用磁碟內完成。
# 結果見 docs/m2-spike-results.md。

on:
  # 暫時：新 workflow 不在預設分支時 gh 找不到，先用一次 push 讓 GitHub 登錄（所有 job 在 push 時都因 inputs.stage 為空而略過），登錄後移除
  push:
    branches: [wp1/m2-spike]
    paths: ['.github/workflows/m2-spike.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: '要跑哪一段'
        type: choice
        default: cleanup
        options:
          - cleanup
          - download
          - inspect
          - build
      release:
        description: 'Jetson Linux 版本（39.2.1 或 39.2.0）'
        type: choice
        default: '39.2.1'
        options:
          - '39.2.1'
          - '39.2.0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cleanup:
    name: cleanup (${{ matrix.runner }})
    if: ${{ inputs.stage == 'cleanup' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 清理量測
        run: bash tools/spike/m2-cleanup.sh
      - name: 摘要
        if: ${{ always() }}
        run: |
          . tools/spike/m2-lib.sh
          { echo "## cleanup ${{ matrix.runner }}"; report_md; echo; echo "### 候選項目（bytes）"; echo '```'; cat "$RES/candidates.tsv" 2>/dev/null; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: m2res-cleanup-${{ matrix.runner }}
          path: ${{ runner.temp }}/m2res
          retention-days: 7

  download:
    name: download (arm)
    if: ${{ inputs.stage == 'download' || inputs.stage == 'inspect' || inputs.stage == 'build' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DL: ${{ github.workspace }}/../m2dl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 版本資訊（檔名與雜湊）
        id: meta
        run: |
          . tools/spike/m2-release.sh "${{ inputs.release }}"
          {
            echo "bsp=$BSP"; echo "bsp_sha256=$BSP_SHA256"
            echo "rfs=$RFS"; echo "rfs_sha256=$RFS_SHA256"
            echo "src=$SRC"; echo "src_sha256=$SRC_SHA256"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$DL"; echo "dl=$(readlink -f "$DL")" >> "$GITHUB_OUTPUT"
          df -B1 / | tail -1
      - name: 快取還原／儲存 BSP
        id: c_bsp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.meta.outputs.dl }}/${{ steps.meta.outputs.bsp }}
          key: m2spike-v1-${{ steps.meta.outputs.bsp }}-${{ steps.meta.outputs.bsp_sha256 }}
      - name: 快取還原／儲存 範例 rootfs
        id: c_rfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.meta.outputs.dl }}/${{ steps.meta.outputs.rfs }}
          key: m2spike-v1-${{ steps.meta.outputs.rfs }}-${{ steps.meta.outputs.rfs_sha256 }}
      - name: 快取還原／儲存 公開原始碼
        id: c_src
        if: ${{ steps.meta.outputs.src_sha256 != 'PENDING' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.meta.outputs.dl }}/${{ steps.meta.outputs.src }}
          key: m2spike-v1-${{ steps.meta.outputs.src }}-${{ steps.meta.outputs.src_sha256 }}
      - name: 下載＋核對（快取有的就只核對 SHA-256）
        run: |
          echo "cache-hit bsp=${{ steps.c_bsp.outputs.cache-hit }} rootfs=${{ steps.c_rfs.outputs.cache-hit }} src=${{ steps.c_src.outputs.cache-hit }}"
          bash tools/spike/m2-download.sh "${{ inputs.release }}" "${{ steps.meta.outputs.dl }}"
      - name: 摘要
        if: ${{ always() }}
        run: |
          . tools/spike/m2-lib.sh
          { echo "## download (arm) ${{ inputs.release }}"; report_md; echo; echo '```'; cat "$RES/downloads.tsv" 2>/dev/null; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: m2res-download
          path: ${{ runner.temp }}/m2res
          retention-days: 7

  inspect:
    name: inspect (arm)
    needs: download
    if: ${{ inputs.stage == 'inspect' || inputs.stage == 'build' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 版本資訊
        id: meta
        run: |
          . tools/spike/m2-release.sh "${{ inputs.release }}"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"; echo "src_sha256=$SRC_SHA256" >> "$GITHUB_OUTPUT"
          # 路徑要和 download job 相同（actions/cache 的 version 含路徑字串）
          mkdir -p "$GITHUB_WORKSPACE/../m2dl"; echo "dl=$(readlink -f "$GITHUB_WORKSPACE/../m2dl")" >> "$GITHUB_OUTPUT"
      - name: 快取還原 公開原始碼
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.meta.outputs.dl }}/${{ steps.meta.outputs.src }}
          key: m2spike-v1-${{ steps.meta.outputs.src }}-${{ steps.meta.outputs.src_sha256 }}
          fail-on-cache-miss: true
      - name: 核對
        run: bash tools/spike/m2-download.sh "${{ inputs.release }}" "${{ steps.meta.outputs.dl }}" src
      - name: 解開並檢視
        run: bash tools/spike/m2-inspect.sh "${{ steps.meta.outputs.dl }}" "$RUNNER_TEMP/w"
      - name: 摘要
        if: ${{ always() }}
        run: |
          . tools/spike/m2-lib.sh
          { echo "## inspect (arm) ${{ inputs.release }}"; report_md; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: m2res-inspect
          path: ${{ runner.temp }}/m2res
          retention-days: 7

  build:
    name: build (arm)
    needs: download
    if: ${{ inputs.stage == 'build' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 版本資訊
        id: meta
        run: |
          . tools/spike/m2-release.sh "${{ inputs.release }}"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"; echo "src_sha256=$SRC_SHA256" >> "$GITHUB_OUTPUT"
          # 路徑要和 download job 相同（actions/cache 的 version 含路徑字串）
          mkdir -p "$GITHUB_WORKSPACE/../m2dl"; echo "dl=$(readlink -f "$GITHUB_WORKSPACE/../m2dl")" >> "$GITHUB_OUTPUT"
      - name: 快取還原 公開原始碼
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.meta.outputs.dl }}/${{ steps.meta.outputs.src }}
          key: m2spike-v1-${{ steps.meta.outputs.src }}-${{ steps.meta.outputs.src_sha256 }}
          fail-on-cache-miss: true
      - name: 核對
        run: bash tools/spike/m2-download.sh "${{ inputs.release }}" "${{ steps.meta.outputs.dl }}" src
      - name: 編譯（原生 aarch64）
        env:
          HANDOFF: ${{ runner.temp }}/handoff
        run: bash tools/spike/m2-build.sh "${{ steps.meta.outputs.dl }}" "$RUNNER_TEMP/w"
      - name: 傳給下一個 job（artifact）交付與紀錄檔
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m2-handoff-deliverables
          path: |
            ${{ runner.temp }}/handoff/deliverables.tar.zst
            ${{ runner.temp }}/handoff/buildrecord.listsha
            ${{ runner.temp }}/handoff/image.sha256
          compression-level: 0
          retention-days: 1
      - name: 傳給下一個 job（cache）整個輸出資料夾
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/handoff/everything.tar.zst
          key: m2spike-handoff-${{ github.run_id }}
      - name: 摘要
        if: ${{ always() }}
        run: |
          . tools/spike/m2-lib.sh
          { echo "## build (arm) ${{ inputs.release }}"; report_md; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: m2res-build
          path: ${{ runner.temp }}/m2res
          retention-days: 7

  handoff:
    name: handoff (arm)
    needs: build
    if: ${{ inputs.stage == 'build' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: artifact 還原
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m2-handoff-deliverables
          path: ${{ runner.temp }}/h-art
      - name: cache 還原
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/handoff/everything.tar.zst
          key: m2spike-handoff-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: 解開、驗證、重新打包
        run: bash tools/spike/m2-handoff-check.sh "$RUNNER_TEMP/h-art" "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/w"
      - name: 摘要
        if: ${{ always() }}
        run: |
          . tools/spike/m2-lib.sh
          { echo "## handoff (arm)"; report_md; } | tee -a "$GITHUB_STEP_SUMMARY"
