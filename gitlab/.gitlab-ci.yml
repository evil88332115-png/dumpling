# dumpling 的 GitLab CI 範本（內部 GitLab 版）。對照與搬移步驟見 docs/GITLAB-PORT.md，用法見 gitlab/README.md。
#
# 用法：複製成產品 repo 根目錄的 .gitlab-ci.yml，或在內部 repo 用 include:local 引入（注意：Sigstore 簽章的 id_tokens
# 必須寫在被簽署的專案本身，include 進來的 CI 檔與 child pipeline 不支援，見 GITLAB-PORT 第 9 節）。
#
# job 呼叫的指令與 GitHub 版相同（pipeline/run-step.sh、pipeline/platform.sh、pipeline/watch/*）；已對照 M2 合併後的 main 核對（GITLAB-PORT T-01）。
# runner 的前提（GITLAB-PORT 第 5 節）：跟 GitHub 代管 runner 一樣——非 root 時要有免密碼 sudo（install-scan-tools.sh、install-tools.sh 用 sudo）；
# scan 用的 runner 要能跑 docker（pipeline/platforms/*/scan.sh 目前一定開臨時 DT，常駐 DT 模式是待辦 T-14）。
#
# 這份範本只由「語法檢查＋單元測試」驗證過（gitlab/tests、官方 CI JSON schema），尚未在內部 GitLab 實際執行。
# 標「待內部驗證」的地方，是官方文件沒寫、要在內部環境確認的行為。

stages:
  - validate
  - build
  - scan
  - release
  - watch

variables:
  # 全部 job 的執行映像。預設值是固定版本的公開映像，內部請改成 RD 的編譯／掃描映像（固定 digest 或固定版本，不可用 latest）。
  DUMPLING_IMAGE: "ubuntu:24.04"
  # 映像裡沒有的工具，用 apt 安裝（內部映像已含這些就清空）
  DUMPLING_APT: "git curl ca-certificates python3 python3-yaml jq sudo"
  # 開發版（dev 分支與排程）要跑的專案；空白代表 projects/ 底下全部（M2 的 project-info.py --matrix）
  DUMPLING_DEV_PROJECTS: ""
  # 選填：要簽章 Release 附件時改成 "cosign-keyless"（見 GITLAB-PORT 第 9 節；預設不簽）
  DUMPLING_SIGN_MODE: "none"
  # 暫存與輸出放專案資料夾外，避免被掃到自己（artifacts 只收複製進專案資料夾的部分）
  DUMPLING_OUT_BASE: "$CI_BUILDS_DIR/dumpling-out/$CI_PROJECT_PATH_SLUG-$CI_PIPELINE_ID"
  GIT_DEPTH: "1"

default:
  image: $DUMPLING_IMAGE
  interruptible: true

# 哪些情況建立 pipeline：沒有任何規則符合就不建立（官方：workflow:rules，沒有規則為 true 時 pipeline 不會執行）
workflow:
  rules:
    # 1) tag <專案>/<版本> → release
    - if: '$CI_COMMIT_TAG =~ /^[a-z0-9][a-z0-9-]*\/v[0-9][A-Za-z0-9._+-]*$/'
    # 2) 排程：每日監控、開發版或第 14 條倒數，由排程變數 DUMPLING_JOB 區分
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($DUMPLING_JOB == "watch" || $DUMPLING_JOB == "dev" || $DUMPLING_JOB == "art14")'
    # 3) dev/** 分支與預設分支的 push → dev、tests、firmware
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && ($CI_COMMIT_BRANCH =~ /^dev\// || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
    # 4) merge request → tests、firmware
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # 5) 手動從網頁或 API 建立
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'

# ---------------------------------------------------------------------------
# 共用片段
# ---------------------------------------------------------------------------

.rules-tag-release:
  rules:
    # 真的 tag push 才發 Release：在 tag ref 上從網頁或 API 手動建的 pipeline 也有 CI_COMMIT_TAG，不能因此發正式 Release（#72 驗證應修 2）
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^[a-z0-9][a-z0-9-]*\/v[0-9][A-Za-z0-9._+-]*$/'
    # T-17：手動試跑 release（代替 GitHub 的「只建 draft Release」；GitLab 沒有 draft Release）。網頁或 API 建立 pipeline 時帶
    # DUMPLING_RELEASE_DRY_RUN=1 與 DUMPLING_RELEASE_TAG=<專案>/<版本>：跑 build、scan，publish 只驗證，不上傳 Package、不建 Release、不開 Issue。
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $DUMPLING_RELEASE_DRY_RUN == "1" && $DUMPLING_RELEASE_TAG =~ /^[a-z0-9][a-z0-9-]*\/v[0-9][A-Za-z0-9._+-]*$/'

# 只有真的 tag push、而且不是試跑才跑（簽章會寫進透明紀錄；規則就排除試跑，不只靠腳本裡的檢查）
.rules-tag-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^[a-z0-9][a-z0-9-]*\/v[0-9][A-Za-z0-9._+-]*$/ && $DUMPLING_RELEASE_DRY_RUN != "1"'

.rules-dev:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DUMPLING_JOB == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^dev\//'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
      allow_failure: true

.setup:
  script:
    - set -eu
    # root（docker executor 的預設）不需要 sudo；非 root（shell executor）用免密碼 sudo，同 GitHub 代管 runner
    - if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO=sudo; fi; export SUDO
    - |
      if [ -n "$DUMPLING_APT" ]; then
        # 內部映像若已含這些套件，把 DUMPLING_APT 清空即可（不需要 root 與外網）；清空時也不裝 platform.yml 的 build.apt／scan.apt（映像要自己含）
        $SUDO apt-get update -qq && $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $DUMPLING_APT > /dev/null
      fi

# 由 tag（release）或 parallel:matrix 的 PROJECT（dev）決定 PROJECT、VERSION；project-info.py 驗證格式並確認專案與版本存在。
# 不用管線（|）接 project-info.py：不同 shell 的 pipefail 行為不同，失敗會被吃掉。
.resolve-from-tag:
  script:
    # tag pipeline 用 CI_COMMIT_TAG；手動試跑（T-17）用 DUMPLING_RELEASE_TAG，而且一定要帶 DUMPLING_RELEASE_DRY_RUN=1
    - |
      RELEASE_TAG="${CI_COMMIT_TAG:-}"
      if [ -z "$RELEASE_TAG" ]; then
        [ "${DUMPLING_RELEASE_DRY_RUN:-0}" = 1 ] || { echo "release: FAIL（沒有 tag；手動試跑要帶 DUMPLING_RELEASE_DRY_RUN=1 與 DUMPLING_RELEASE_TAG）"; exit 1; }
        RELEASE_TAG="${DUMPLING_RELEASE_TAG:-}"
      fi
      export RELEASE_TAG
    - python3 -I pipeline/project-info.py "$RELEASE_TAG" > info.txt
    - cat info.txt
    - |
      PROJECT=$(sed -n 's/^PROJECT=//p' info.txt); VERSION=$(sed -n 's/^VERSION=//p' info.txt)
      BUILD_MODE=$(sed -n 's/^BUILD_MODE=//p' info.txt); SCAN_TOOLS=$(sed -n 's/^SCAN_TOOLS=//p' info.txt)
      BUILD_APT=$(sed -n 's/^BUILD_APT=//p' info.txt); SCAN_APT=$(sed -n 's/^SCAN_APT=//p' info.txt)
      export PROJECT VERSION BUILD_MODE SCAN_TOOLS BUILD_APT SCAN_APT
      export DUMPLING_PROJECT_DIR="projects/$PROJECT"
      export DUMPLING_OUT="$DUMPLING_OUT_BASE/$PROJECT/$VERSION"

.resolve-from-matrix:
  script:
    # 版本取 sources.yml 的最後一個版本（M2 的 project-info.py --matrix）
    - python3 -I pipeline/project-info.py --matrix "$PROJECT" > matrix.json
    - VERSION=$(python3 -I -c 'import json; print(json.load(open("matrix.json"))[0]["version"])')
    - python3 -I pipeline/project-info.py --dir "projects/$PROJECT" "$VERSION" > info.txt
    - cat info.txt
    - |
      BUILD_MODE=$(sed -n 's/^BUILD_MODE=//p' info.txt); SCAN_TOOLS=$(sed -n 's/^SCAN_TOOLS=//p' info.txt)
      BUILD_APT=$(sed -n 's/^BUILD_APT=//p' info.txt); SCAN_APT=$(sed -n 's/^SCAN_APT=//p' info.txt)
      export VERSION BUILD_MODE SCAN_TOOLS PROJECT BUILD_APT SCAN_APT
      export DUMPLING_PROJECT_DIR="projects/$PROJECT"
      export DUMPLING_OUT="$DUMPLING_OUT_BASE/$PROJECT/$VERSION"

# build 與 scan 的共同步驟（對應 pipeline.yml 的 build／scan job）。順序：先 .setup，再 .resolve-*，再下面的片段。
.build-steps:
  script:
    # platform.yml 的 build.apt（同 pipeline.yml 的 build job；project-info.py 已驗證套件名稱）
    - |
      if [ -n "$DUMPLING_APT" ] && [ "$BUILD_MODE" = compile ] && [ -n "$BUILD_APT" ]; then
        $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $BUILD_APT > /dev/null
      fi
    - bash pipeline/run-step.sh validate "$DUMPLING_PROJECT_DIR" "$VERSION"
    # build.mode 是 none 的平台沒有編譯步驟：交給 scan 去記 NOT_RUN
    - |
      rm -rf build-handoff && mkdir -p build-handoff
      if [ "$BUILD_MODE" = compile ]; then
        bash pipeline/run-step.sh fetch "$DUMPLING_PROJECT_DIR" "$VERSION"
        bash pipeline/run-step.sh build "$DUMPLING_PROJECT_DIR" "$VERSION"
        # 交給 scan 的東西都在 $DUMPLING_OUT/handoff/；複製進專案資料夾才能當 artifact
        cp -a "$DUMPLING_OUT/handoff" build-handoff/handoff
        cp -a "$DUMPLING_OUT/pipeline-steps.tsv" build-handoff/
      else
        echo "build.mode: $BUILD_MODE" > build-handoff/NO-BUILD
      fi

.scan-steps:
  script:
    # 臨時 DT（同 GitHub 版）：pipeline/platforms/*/scan.sh 目前一定用 dt-ephemeral.sh 開臨時 DT（要 docker），把連線資訊寫進 PILOT_ENV 這個路徑、
    # 自己下載鏡像、MIRROR_REFRESH_STATUS 設空。目標是改連內部常駐 DT（GITLAB-PORT 第 4 節），要等 scan.sh 有常駐 DT 模式（待辦 T-14）。
    # PILOT_ENV 放單獨一個資料夾（sca-scan 的沙箱會遮蔽 PILOT_ENV 所在的整個資料夾；同 pipeline.yml）。
    # install-tools.sh 只有 amd64 的 Syft／Grype（同 pipeline.yml 的 scan job 檢查）
    - |
      [ "$(uname -m)" = x86_64 ] || { echo "scan: FAIL（掃描 runner 要 x86_64，這台是 $(uname -m)）"; exit 1; }
    - export PILOT_ENV="$DUMPLING_OUT_BASE/pilot-env/pilot.env"
    - |
      command -v docker > /dev/null || { echo "scan: FAIL（runner 沒有 docker：臨時 DT 需要；常駐 DT 模式是待辦 T-14）"; exit 1; }
    # scan job 的 apt（同 pipeline.yml：bubblewrap、python3-yaml＋platform.yml 的 scan.apt）
    - |
      if [ -n "$DUMPLING_APT" ]; then
        $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends bubblewrap python3-yaml $SCAN_APT > /dev/null
      fi
    - mkdir -p "$DUMPLING_OUT" "$DUMPLING_OUT_BASE/tools"
    - |
      if [ -d build-handoff/handoff ]; then
        cp -a build-handoff/handoff "$DUMPLING_OUT/handoff"; cp -a build-handoff/pipeline-steps.tsv "$DUMPLING_OUT/"
      else
        bash pipeline/run-step.sh --record "$DUMPLING_PROJECT_DIR" "$VERSION" build NOT_RUN 4 "build.mode: $BUILD_MODE"
      fi
    - bash pipeline/install-scan-tools.sh "${SCAN_TOOLS:-sbom-only}" "$DUMPLING_OUT_BASE/tools/versions.txt"
    - bash pipeline/run-step.sh validate "$DUMPLING_PROJECT_DIR" "$VERSION"
    - bash pipeline/run-step.sh fetch "$DUMPLING_PROJECT_DIR" "$VERSION"
    - bash pipeline/run-step.sh assemble "$DUMPLING_PROJECT_DIR" "$VERSION"
    - bash pipeline/run-step.sh scan "$DUMPLING_PROJECT_DIR" "$VERSION"
    - |
      rm -rf result && mkdir -p result
      [ -d "$DUMPLING_OUT/release" ] && cp -r "$DUMPLING_OUT/release/." result/ || true
      for f in handoff/build.json assemble.json scan.json expected-check.txt pipeline-steps.tsv; do [ -f "$DUMPLING_OUT/$f" ] && cp "$DUMPLING_OUT/$f" result/ || true; done
      [ -f "$DUMPLING_OUT/summary.md" ] && cat "$DUMPLING_OUT/summary.md" || true

.build:
  stage: build
  tags: [dumpling-build]
  timeout: 2 hours
  interruptible: false
  after_script:
    # 輸出放在專案資料夾外，job 結束就刪（磁碟的第一道防線；runner 本身的清理見 GITLAB-PORT 第 5 節）
    - rm -rf "$DUMPLING_OUT_BASE"
  artifacts:
    paths: [build-handoff/]
    expire_in: 1 day

# 上一份核心 CVE 鏡像（pipeline/lib/mirrors.sh 的 KCVE_CACHE_DIR）：上游沒變就沿用，git.kernel.org 連不上就用 48 小時內的上一份頂替（ATTENTION）。
# 官方（docs.gitlab.com/ci/caching）：cache 路徑要在專案資料夾內；預設存在 runner 那台機器（設了分散式 cache 才共用）；
# 保護與非保護分支預設不共用 cache；cache 在 after_script 之後才封存。scan 與 watch:compute 用同一個 key。
# scan 失敗也存（同 pipeline.yml 的 !cancelled()）：cache:when: always，新抓的鏡像在 after_script 複製進 cache 資料夾（after_script 在 cache 封存之前執行）。
.kcve-cache:
  variables:
    KCVE_CACHE_DIR: "$CI_PROJECT_DIR/.kcve-cache/kcve"
  cache:
    key: kernel-cve-mirror
    paths: [.kcve-cache/kcve/]
    when: always

.scan:
  stage: scan
  extends: [.kcve-cache]
  tags: [dumpling-scan]
  timeout: 4 hours
  interruptible: false
  variables:
    # 臨時 DT（pipeline/dt-ephemeral.sh）：compose 專案名與狀態資料夾每個 job 分開（自架 runner 不像 GitHub 每次換新機器；
    # 預設的 /tmp 與 dumpling-dt 會讓同一台的 job 互相干擾）。埠 DT_PORT 預設 8080：掃描 runner 的 concurrent 請設 1（第 5 節）。
    DT_EPH_PROJECT: "dumpling-dt-$CI_JOB_ID"
    DT_EPH_DIR: "$DUMPLING_OUT_BASE/dt-eph"
  after_script:
    # job 被取消或逾時時 scan.sh 的 EXIT trap 不一定跑到：這裡再收一次臨時 DT（同 pipeline.yml 的 always() 的 down），容器與 volume 不殘留
    - bash pipeline/dt-ephemeral.sh down || true
    # 核心 CVE 鏡像：只有這次新抓的才放進 cache 資料夾（頂替用的舊資料不存回去；同 pipeline.yml 的 kcve-fresh）。after_script 是新的 shell，用 glob 找
    - |
      for d in "$DUMPLING_OUT_BASE"/*/*/mirrors; do
        [ -d "$d" ] || continue
        if (export MIRRORS_DIR="$d"; . pipeline/lib/mirrors.sh; mirror_is_fresh kcve); then
          rm -rf "$KCVE_CACHE_DIR"; mkdir -p "$(dirname "$KCVE_CACHE_DIR")"; cp -a "$d/kcve" "$KCVE_CACHE_DIR"
        fi
      done
    - rm -rf "$DUMPLING_OUT_BASE"
  artifacts:
    when: always
    paths: [result/]
    expire_in: 7 days

# ---------------------------------------------------------------------------
# validate：單元測試（對應 GitHub 的 tests.yml 的 unit-tests；公開檢查 public-check 是公開 repo 專用，內部不需要）
# ---------------------------------------------------------------------------

validate:unit-tests:
  stage: validate
  rules:
    # T-19：分支有開著的 merge request 時，branch pipeline 不跑（MR pipeline 會跑），不重複。官方 workflow 的「避免重複 pipeline」寫法，
    # 放在 job 層級：dev/** 的 build／scan 只在 branch pipeline 跑，整條 branch pipeline 不能關
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # tag 的 push 也是 push（官方 job_rules：push 事件含分支與 tag）：加 $CI_COMMIT_BRANCH，tag pipeline 不跑（同 tests.yml 不在 tag 跑，不擋 release）
    - if: '($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH) || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  tags: [dumpling]
  timeout: 30 minutes
  script:
    - !reference [.setup, script]
    - bash tests/run.sh

# ---------------------------------------------------------------------------
# release：tag <專案>/<版本> → build → scan → 發 Release
# ---------------------------------------------------------------------------

release:build:
  extends: [.build, .rules-tag-release]
  script:
    - !reference [.setup, script]
    - !reference [.resolve-from-tag, script]
    - !reference [.build-steps, script]

release:scan:
  extends: [.scan, .rules-tag-release]
  needs: ["release:build"]
  script:
    - !reference [.setup, script]
    - !reference [.resolve-from-tag, script]
    - !reference [.scan-steps, script]

# 正式 Release：附件上傳到 Generic Package Registry（長期保存），再用 Releases API 建 Release 並掛 assets links。
# 同一個 tag 同時只跑一個（resource_group）；tag 已有 Release 時 API 會回錯誤，job 失敗，不覆蓋。
release:publish:
  stage: release
  extends: [.rules-tag-release]
  needs: ["release:scan"]
  tags: [dumpling]
  timeout: 30 minutes
  interruptible: false
  resource_group: release-$CI_COMMIT_TAG
  script:
    - !reference [.setup, script]
    - !reference [.resolve-from-tag, script]
    - |
      python3 -I pipeline/release-meta.py --project "$PROJECT" --version "$VERSION" --tag "$RELEASE_TAG" --notes result/notes.md \
        --commit "$CI_COMMIT_SHA" --run-id "$CI_PIPELINE_ID" --steps result/pipeline-steps.tsv \
        --scan-summary "result/scan-summary-$PROJECT-$VERSION.json" --out result/release-meta.json
      printf 'release-meta.json\trelease-meta.json\n' >> result/manifest.tsv
    # 先驗再傳（T-21）：release-publish.sh 先用 release-payload.py 驗完全部附件，驗不過一個檔都不上傳；
    # DUMPLING_RELEASE_DRY_RUN=1（T-17）只驗證，不上傳 Package、不建 Release
    - bash gitlab/release-publish.sh result "$RELEASE_TAG" "$PROJECT" "$VERSION"
  artifacts:
    # 長期保存靠 Generic Package 與 Release；這裡只留給除錯與簽章 job 用
    paths: [result/, release.json]
    expire_in: 14 days

# 選用：Release 附件簽章（Sigstore cosign keyless）。預設不跑；內部 Self-Managed 要先有自架 Sigstore（GITLAB-PORT 第 9 節）。
# 官方限制：id_tokens 要寫在被簽署的專案本身（不能 include、不能放 child pipeline）。cosign 需 2.0.1 以上。
release:sign:
  stage: release
  extends: [.rules-tag-only]
  needs: ["release:publish"]
  tags: [dumpling]
  # NOT_RUN（沒開簽章、試跑）是結束碼 3、允許失敗；真的簽章失敗是失敗（#72 驗證建議；官方 allow_failure:exit_codes）
  allow_failure:
    exit_codes: [3]
  interruptible: false
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - !reference [.setup, script]
    - |
      test "$DUMPLING_SIGN_MODE" = cosign-keyless || { echo "sign: NOT_RUN（DUMPLING_SIGN_MODE 不是 cosign-keyless）"; exit 3; }
    - |
      [ "${DUMPLING_RELEASE_DRY_RUN:-0}" != 1 ] || { echo "sign: NOT_RUN（試跑不簽章：簽章會寫進透明紀錄）"; exit 3; }
    # cosign 執行檔要固定版本與 sha256：進 pipeline/lib/tools.lock（待辦 T-09，M7 的 A2 一併處理）
    - bash pipeline/install-tool.sh cosign "$DUMPLING_OUT_BASE/bin"
    - |
      cd result
      while IFS=$'\t' read -r f label; do
        "$DUMPLING_OUT_BASE/bin/cosign" sign-blob --yes "$f" --bundle "$f.cosign.bundle"
      done < manifest.tsv
  artifacts:
    paths: ["result/*.cosign.bundle"]
    expire_in: 14 days

# ---------------------------------------------------------------------------
# dev：dev/** 分支 push、排程（DUMPLING_JOB=dev）→ 同一套 build／scan，不發正式 Release
# ---------------------------------------------------------------------------
# 待辦 T-02：GitHub 版用動態 matrix（project-info.py --matrix）。GitLab 範本先用固定清單（改 PROJECT 的值）；
# 要動態產生，改成先產生 child pipeline 的 YAML 再 trigger:include:artifact（官方：child pipeline 可有自己的 rules／workflow）。

dev:build:
  extends: [.build, .rules-dev]
  parallel:
    matrix:
      - PROJECT: ["orin-nano-demo"]
  script:
    - !reference [.setup, script]
    - !reference [.resolve-from-matrix, script]
    - !reference [.build-steps, script]

dev:scan:
  extends: [.scan, .rules-dev]
  parallel:
    matrix:
      - PROJECT: ["orin-nano-demo"]
  needs:
    - job: "dev:build"
      parallel:
        matrix:
          - PROJECT: ["orin-nano-demo"]
  script:
    - !reference [.setup, script]
    - !reference [.resolve-from-matrix, script]
    - !reference [.scan-steps, script]

# 開發版最新 SBOM 的「滾動 pre-release」（GitHub 的 dev/<專案>）：GitLab 版預計放 Generic Package（套件版本固定 dev，覆蓋）。
# 待辦 T-03：每日監控的 GitLab 版 collect 要讀這裡；Generic Package 同名檔案是否覆蓋，官方文件沒寫，待內部環境驗證。
dev:publish:
  stage: release
  extends: [.rules-dev]
  needs:
    - job: "dev:scan"
      parallel:
        matrix:
          - PROJECT: ["orin-nano-demo"]
  tags: [dumpling]
  # T-20：NOT_RUN 用結束碼 3，只有 3 算允許失敗（官方 allow_failure:exit_codes）；其他結束碼照常是失敗。同 GitHub 版「NOT_RUN 不是失敗、但照實列出」
  allow_failure:
    exit_codes: [3]
  script:
    - echo "dev:publish NOT_RUN（待辦 T-03：滾動開發版的 GitLab 版發布方式尚未定案，見 docs/GITLAB-PORT.md）"
    - exit 3

# ---------------------------------------------------------------------------
# firmware：firmware/ 與韌體相關腳本有變動時（對應 firmware.yml 的 firmware-fetch）
# ---------------------------------------------------------------------------
# rules:changes 在 tag、排程、手動 pipeline 沒有 push 事件、一律算有變動（官方 ci/yaml）；tag 的 push 也是 push（官方 job_rules），
# 所以條件要加 $CI_COMMIT_BRANCH：只在分支 push 與 merge request 跑，tag pipeline 不跑（不擋 release）。

firmware:fetch:
  stage: validate
  tags: [dumpling]
  timeout: 30 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'     # T-19：同 validate:unit-tests
      when: never
    - if: '($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH) || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - firmware/**/*
        - pipeline/firmware-*.sh
        - pipeline/install-tool.sh
        - pipeline/check-tool-version.sh
        - pipeline/lib/tools.lock
        - pipeline/firmware-expect.py
        - pipeline/lib/firmware_*.py
        - pipeline/dt-*
        - pipeline/scan-status-check.py
        - tools/pilot/**/*
        - tools/e2e/**/*
        - tools/cra/**/*
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
      allow_failure: true
  script:
    - !reference [.setup, script]
    - python3 -I -c 'import yaml; print("PyYAML", yaml.__version__)'
    - pipeline/firmware-fetch.sh firmware/*/*/firmware.yml --out "$DUMPLING_OUT_BASE/firmware-dl" > fetch.log
    - cat fetch.log
    # ATTENTION／GAP（結束碼 2）不算失敗；FAIL、expected 不符才失敗。狀態行才是結果，job 綠燈不代表韌體安全。
    - |
      rc=0
      pipeline/firmware-ci.sh "$DUMPLING_OUT_BASE/firmware-dl" "$DUMPLING_OUT_BASE/firmware-work" firmware-out firmware-summary.md || rc=$?
      cat firmware-summary.md
      # 供應商 SBOM（kind: sbom）的品質檢查（同 firmware.yml）：sbomqs 固定版本與 sha256 在 pipeline/lib/tools.lock；只有 FAIL 算失敗
      out=$(pipeline/install-tool.sh sbomqs "$DUMPLING_OUT_BASE/bin"); exe=$(printf '%s\n' "$out" | tail -n 1)
      pipeline/check-tool-version.sh sbomqs "$exe"
      files=$(find "$DUMPLING_OUT_BASE/firmware-dl/sbom" -mindepth 2 -maxdepth 2 -name '*.sbom.json' 2>/dev/null | sort)
      if [ -z "$files" ]; then
        echo "FIRMWARE-SBOM	NOT_RUN	-	沒有 kind: sbom 的樣本可檢查" > sbom-check.log; cat sbom-check.log
      else
        src=0
        # shellcheck disable=SC2086  # 檔名來自 firmware-fetch 依規則產生的路徑（不含空白）
        SBOMQS="$exe" pipeline/firmware-sbom-check.sh $files --out sbom-check > sbom-check.log || src=$?
        cat sbom-check.log
        [ "$src" = 0 ] || [ "$rc" != 0 ] || rc=$src
      fi
      exit "$rc"
  after_script:
    - rm -rf "$DUMPLING_OUT_BASE"
  artifacts:
    when: always
    paths: [firmware-out/, firmware-summary.md, fetch.log, sbom-check/, sbom-check.log]
    expire_in: 14 days

# 韌體 SBOM 上傳常駐 DT（GitHub 版是臨時 DT 的 firmware-dt job）。待辦 T-04：pilot.env／常駐 DT 的上傳驗證流程在內部確認後再開。
firmware:dt:
  stage: scan
  tags: [dumpling-scan]
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH) || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
      allow_failure: true
  needs:
    - job: "firmware:fetch"
      optional: true
      artifacts: true
  script:
    - !reference [.setup, script]
    - |
      test -n "${PILOT_ENV:-}" || { echo "firmware-dt: FAIL（沒有 PILOT_ENV）"; exit 1; }
    - |
      echo "firmware-dt: NOT_RUN（待辦 T-04：常駐 DT 版的 firmware-dt.sh 呼叫方式待內部驗證）"
    - exit 3

# ---------------------------------------------------------------------------
# watch：每日監控（排程變數 DUMPLING_JOB=watch）。compute 與 notify 分開，對應 watch-round.yml
# ---------------------------------------------------------------------------
# 待辦 T-05：pipeline/watch/collect.py（讀 Release）與 issues.py（讀寫 Issue）已有 GitLab 後端（--backend gitlab），
# 但只用假 API 測過、沒有對真實 GitLab 驗證；所以這兩個 job 仍是 when: manual，不會自動跑（驗證完再改，見 GITLAB-PORT T-05）。

# T-16：手動入口（同 watch.yml 的 workflow_dispatch）。網頁 Run pipeline 或 API 帶 pipeline 變數：
#   DUMPLING_WATCH_MODE=real：照輸入跑一輪（DUMPLING_WATCH_DRY_RUN=1 只算不寫；DUMPLING_WATCH_BASELINE=1 還沒有狀態時建立第一次的基準，
#     要明確指定，狀態 Issue 不見時不會自動重建）
#   DUMPLING_WATCH_MODE=drill：watch:drill（合成資料的三輪演練＋關閉）
# 排程的 real 預設只算不寫（同 D-040：第一次真實基準看過「會開哪些 Issue」之前），CI/CD 變數 WATCH_REAL_ISSUES=on 才真的開 Issue。
.rules-watch:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DUMPLING_JOB == "watch"'
      when: manual
      allow_failure: true
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $DUMPLING_WATCH_MODE == "real"'

watch:compute:
  stage: watch
  extends: [.rules-watch, .kcve-cache]
  tags: [dumpling-scan]
  timeout: 90 minutes
  interruptible: false
  variables:
    # 內部鏡像：CISA KEV、EUVD、核心 CNA、Grype DB 由 sca-center 的鏡像腳本更新（待辦 T-06）
    INTERNAL_MIRROR_URL: ""
  script:
    - !reference [.setup, script]
    - |
      python3 -I pipeline/watch/issues.py --help 2>&1 | grep -q -- '--backend' || { echo "watch: NOT_RUN（issues.py 還沒有 GitLab 後端：GITLAB-PORT 待辦 T-05）"; exit 3; }
    - bash tools/e2e/install-tools.sh "$DUMPLING_OUT_BASE/tools/bin" "$DUMPLING_OUT_BASE/tools/versions.txt" --sbom-only
    # grype 要在 PATH（feeds.sh 的 grype db update、match.py；同 watch-round.yml）
    - $SUDO install -m 0755 -t /usr/local/bin "$DUMPLING_OUT_BASE/tools/bin/grype"
    # 核心 CVE 鏡像的上一份：feeds.sh 讀 KCVE_CACHE_DIR（pipeline/lib/mirrors.sh 的 mirror_kernel_cve；wp2/watch-m2 的 feeds.sh 起）
    - pipeline/watch/feeds.sh "$DUMPLING_OUT_BASE/w/feeds"
    - |
      export MIRRORS_DIR="$DUMPLING_OUT_BASE/w/feeds"
      . pipeline/lib/mirrors.sh
      if mirror_is_fresh kernel-cve; then rm -rf "$KCVE_CACHE_DIR"; mkdir -p "$(dirname "$KCVE_CACHE_DIR")"; cp -a "$MIRRORS_DIR/kernel-cve" "$KCVE_CACHE_DIR"; fi
    # 讀取用的 token：狀態 Issue 與監控 Issue 都是 confidential（官方：Planner 以上才看得到），私有專案的 Release 也要權限。
    # WATCH_GITLAB_READ_TOKEN：project access token，scope read_api（官方：唯讀 API），角色 Planner（17.7 起；之前是 Reporter）；protected＋masked。
    # 寫入用的 WATCH_GITLAB_TOKEN（scope api）只給 watch:notify。
    - |
      test -n "${WATCH_GITLAB_READ_TOKEN:-}" || { echo "watch: FAIL（沒有 WATCH_GITLAB_READ_TOKEN：protected＋masked 變數，只在保護分支可用）"; exit 1; }
    # 結束碼同 watch-round.yml：collect 0／3（3＝沒有可監控的 Release），match 0／2／3（ATTENTION、GAP 不算失敗；只有 1 FAIL 讓 job 變紅）
    - |
      rc=0; GITLAB_TOKEN="$WATCH_GITLAB_READ_TOKEN" python3 -I pipeline/watch/collect.py --backend gitlab --gitlab-url "$CI_API_V4_URL" --project "$CI_PROJECT_ID" --out "$DUMPLING_OUT_BASE/w/inv" || rc=$?
      [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit "$rc"
    # T-23：支援期限與 EOL（pipeline/watch/support.py，WATCH.md 第 7 節）。放在比對前面，失敗不擋每日監控：結果寫進 watch-out-support/status，
    # watch:notify 套用完兩份 plan 之後，status 是 FAIL 才讓 job 變紅（同 watch-round.yml 的 support-fail job）。內部版不加 --demo
    - |
      mkdir -p watch-out-support
      src=0
      python3 -I pipeline/watch/support.py --inventory "$DUMPLING_OUT_BASE/w/inv/inventory.json" --out watch-out-support --run-url "$CI_PIPELINE_URL" || src=$?
      case $src in 0) st=OK ;; 2) st=ATTENTION ;; *) st=FAIL ;; esac
      echo "$st" > watch-out-support/status
      [ -f watch-out-support/report.md ] && cat watch-out-support/report.md || true
      [ "$st" != FAIL ] || echo "support: FAIL（結束碼 $src）：每日監控照常進行，watch:notify 最後會讓 job 變紅"
    - GITLAB_TOKEN="$WATCH_GITLAB_READ_TOKEN" python3 -I pipeline/watch/issues.py read-state --backend gitlab --gitlab-url "$CI_API_V4_URL" --project "$CI_PROJECT_ID" --mode real --out "$DUMPLING_OUT_BASE/w/state"
    - |
      rc=0
      # 第一次的基準只在手動指定時建立（DUMPLING_WATCH_BASELINE=1，同 watch.yml 的 baseline；排程不能自己建）
      ab=()
      if { [ "$CI_PIPELINE_SOURCE" = web ] || [ "$CI_PIPELINE_SOURCE" = api ]; } && [ "${DUMPLING_WATCH_BASELINE:-0}" = 1 ]; then ab=(--allow-baseline); fi
      python3 -I pipeline/watch/match.py --inventory "$DUMPLING_OUT_BASE/w/inv/inventory.json" --state-dir "$DUMPLING_OUT_BASE/w/state" \
        --feeds "$DUMPLING_OUT_BASE/w/feeds" --out watch-out --mode real --run-url "$CI_PIPELINE_URL" "${ab[@]}" || rc=$?
      [ "$rc" = 0 ] || [ "$rc" = 2 ] || [ "$rc" = 3 ] || exit "$rc"
  after_script:
    - rm -rf "$DUMPLING_OUT_BASE"
  artifacts:
    when: always
    paths: [watch-out/plan.json, watch-out/report.md, watch-out/result.json,
            watch-out-support/plan.json, watch-out-support/report.md, watch-out-support/result.json, watch-out-support/status]
    expire_in: 14 days

# notify：只有這個 job 拿得到 WATCH_GITLAB_TOKEN（protected＋masked 的 CI/CD 變數，project access token，scope api；
# 官方：Issues API 寫入需要 api scope，沒有更細的 scope）。狀態 Issue 與命中 Issue 一律 confidential。
watch:notify:
  stage: watch
  extends: [.rules-watch]
  needs: ["watch:compute"]
  tags: [dumpling]
  timeout: 30 minutes
  interruptible: false
  resource_group: watch-notify
  variables:
    DUMPLING_ISSUES_CONFIDENTIAL: "true"
  script:
    - !reference [.setup, script]
    - |
      test -n "${WATCH_GITLAB_TOKEN:-}" || { echo "watch: FAIL（沒有 WATCH_GITLAB_TOKEN：protected＋masked 變數，只在保護分支可用）"; exit 1; }
    - |
      python3 -I pipeline/watch/issues.py --help 2>&1 | grep -q -- '--backend' || { echo "watch: NOT_RUN（issues.py 還沒有 GitLab 後端：GITLAB-PORT 待辦 T-05）"; exit 3; }
    - |
      # 只算不寫（T-16）：手動帶 DUMPLING_WATCH_DRY_RUN=1，或排程而 WATCH_REAL_ISSUES 不是 on（同 watch.yml 的 dry_run 運算式）
      case "${DUMPLING_WATCH_DRY_RUN:-0}" in 0|1) ;; *) echo "watch: FAIL（DUMPLING_WATCH_DRY_RUN 只能是 0 或 1，收到的值不認得：不猜，什麼都不寫）"; exit 1 ;; esac
      d=()
      if [ "${DUMPLING_WATCH_DRY_RUN:-0}" = 1 ] || { [ "$CI_PIPELINE_SOURCE" = schedule ] && [ "${WATCH_REAL_ISSUES:-}" != on ]; }; then
        d=(--dry-run); echo "watch: 只算不寫（dry-run）"
      fi
      # 每日監控：沒有 plan.json（GAP：不建基準、不開 Issue）→ 不動監控 Issue（同 watch-round.yml 的 has_plan）
      rc=0
      if [ -f watch-out/plan.json ]; then
        GITLAB_TOKEN="$WATCH_GITLAB_TOKEN" python3 -I pipeline/watch/issues.py apply --backend gitlab --gitlab-url "$CI_API_V4_URL" \
          --project "$CI_PROJECT_ID" --confidential --mode real --plan watch-out/plan.json "${d[@]}" || rc=$?
      else
        echo "watch: 沒有 plan.json（match 是 GAP），不動監控 Issue"
      fi
      # T-23：支援期限的 Issue（stateless plan，不碰狀態 Issue；每日監控的 apply 失敗也照樣套用，同 watch-round.yml 的 !cancelled()）
      src=0
      if [ -f watch-out-support/plan.json ]; then
        GITLAB_TOKEN="$WATCH_GITLAB_TOKEN" python3 -I pipeline/watch/issues.py apply --backend gitlab --gitlab-url "$CI_API_V4_URL" \
          --project "$CI_PROJECT_ID" --confidential --mode real --plan watch-out-support/plan.json "${d[@]}" || src=$?
      fi
      st=$(cat watch-out-support/status 2>/dev/null || echo FAIL)
      [ "$rc" = 0 ] || exit "$rc"
      [ "$src" = 0 ] || exit "$src"
      [ "$st" != FAIL ] || { echo "support: FAIL（支援期限檢查沒有完成：看 watch:compute 的輸出與 watch-out-support/）"; exit 1; }
  artifacts:
    when: always
    paths: [watch-out/apply-result.json, watch-out-support/apply-result.json]
    expire_in: 14 days

# T-16：每日監控的演練（同 watch.yml 的 drill-1-baseline／drill-2-new-kev／drill-3-repeat／drill-close）。
# 網頁或 API 帶 DUMPLING_WATCH_MODE=drill（DUMPLING_WATCH_DRY_RUN=1 只算不寫）：合成 Release＋合成 KEV，三輪（預期開 0／2／0 個）後關閉。
# 演練 Issue 一律 confidential（後端寫死）、標籤 drill。讀狀態用 WATCH_GITLAB_READ_TOKEN，開／關 Issue 與寫狀態用 WATCH_GITLAB_TOKEN。
# 收掉演練 Issue：watch-drill.sh 收（失敗就整體非 0）；逾時或被取消時腳本的 trap 不一定跑得到，after_script 再收一次。
watch:drill:
  stage: watch
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $DUMPLING_WATCH_MODE == "drill"'
  tags: [dumpling-scan]
  timeout: 90 minutes
  interruptible: false
  resource_group: watch-notify
  script:
    - !reference [.setup, script]
    - |
      test -n "${WATCH_GITLAB_TOKEN:-}" || { echo "watch-drill: FAIL（沒有 WATCH_GITLAB_TOKEN：protected＋masked 變數，只在保護分支可用）"; exit 1; }
      test -n "${WATCH_GITLAB_READ_TOKEN:-}" || { echo "watch-drill: FAIL（沒有 WATCH_GITLAB_READ_TOKEN）"; exit 1; }
    - bash tools/e2e/install-tools.sh "$DUMPLING_OUT_BASE/tools/bin" "$DUMPLING_OUT_BASE/tools/versions.txt" --sbom-only
    - $SUDO install -m 0755 -t /usr/local/bin "$DUMPLING_OUT_BASE/tools/bin/grype"
    - WATCH_READ_TOKEN="$WATCH_GITLAB_READ_TOKEN" WATCH_WRITE_TOKEN="$WATCH_GITLAB_TOKEN" bash gitlab/watch-drill.sh "$DUMPLING_OUT_BASE/drill" watch-drill-out
  after_script:
    # 逾時或被取消時，腳本的 trap 不一定跑得到：再收一次演練 Issue（沒有開著的演練 Issue 時什麼都不做）；dry-run 不收
    - |
      if [ "${DUMPLING_WATCH_DRY_RUN:-0}" != 1 ] && [ -n "${WATCH_GITLAB_TOKEN:-}" ]; then
        GITLAB_TOKEN="$WATCH_GITLAB_TOKEN" python3 -I pipeline/watch/issues.py close-drill --backend gitlab --gitlab-url "$CI_API_V4_URL" --project "$CI_PROJECT_ID" \
          || echo "watch-drill: after_script 收掉演練 Issue 失敗（請人工關閉 drill 標籤的 Issue）"
      fi
    - rm -rf "$DUMPLING_OUT_BASE"
  artifacts:
    when: always
    paths: [watch-drill-out/]
    expire_in: 14 days

# ---------------------------------------------------------------------------
# art14：CRA 第 14 條通報倒數（排程變數 DUMPLING_JOB=art14，每小時；對應 art14.yml）。GITLAB-PORT T-10、docs/ART14.md 第 10 節
# ---------------------------------------------------------------------------
# pipeline/watch/art14.py 有 GitLab 後端，但只用假 API 測過、沒有對真實 GitLab 驗證；所以這個 job 仍是 when: manual（同 watch:*），
# 驗證完再改成自動（見 GITLAB-PORT T-10 的內部驗證清單）。
# 真實案件預設（DUMPLING_ART14_MODE 沒設或不是 drill）：處理標籤 art14 的 confidential Issue；不是 confidential 的 art14 Issue → job FAIL、不寫入。
# 演練：pipeline 變數 DUMPLING_ART14_MODE=drill（處理標籤 art14-drill 的 Issue）。結束碼 0 OK、1 FAIL。
# ART14_GITLAB_TOKEN：project access token，scope api（官方：Issues／Notes 寫入需要 api scope），角色 Developer 以上（要讀得到 confidential Issue、
# 查成員等級；程式開始前會檢查，不夠就 FAIL）；protected＋masked，可以的話再限定到只給 art14 排程用的 environment；和 watch 的 token 分開（只有這個 job 用）。
# 倒數的依據只取自 Developer 以上成員的「art14 紀錄」留言（ART14.md 第 4.1 節），內文的時間不算數。Email 提醒（ART14.md 第 10 節）還沒做。

.rules-art14:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DUMPLING_JOB == "art14"'
      when: manual
      allow_failure: true

art14:countdown:
  stage: watch
  extends: [.rules-art14]
  tags: [dumpling]
  timeout: 10 minutes
  interruptible: false
  resource_group: art14
  script:
    - !reference [.setup, script]
    - |
      test -n "${ART14_GITLAB_TOKEN:-}" || { echo "art14: FAIL（沒有 ART14_GITLAB_TOKEN：protected＋masked 變數，只在保護分支可用）"; exit 1; }
    - |
      mkdir -p art14-out
      DRILL=""
      if [ "${DUMPLING_ART14_MODE:-real}" = drill ]; then DRILL="--drill"; fi
      GITLAB_TOKEN="$ART14_GITLAB_TOKEN" python3 -I pipeline/watch/art14.py countdown --backend gitlab --gitlab-url "$CI_API_V4_URL" \
        --gitlab-project "$CI_PROJECT_ID" --result art14-out/result.json $DRILL
  artifacts:
    when: always
    paths: [art14-out/result.json]
    expire_in: 14 days
